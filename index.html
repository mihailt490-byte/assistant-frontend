<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistant V7 Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #f3f4f6; /* Светло-серый фон по умолчанию */
            color: #111827; 
            font-family: sans-serif; 
            margin: 0; padding: 0;
        }
        .done-task { text-decoration: line-through; color: #9ca3af; }
        .hidden-tab { display: none !important; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Шапка -->
    <header class="p-4 bg-white border-b flex items-center justify-between sticky top-0 flex-shrink-0 shadow-sm z-50">
        <div>
            <h1 id="user-greeting" class="text-xl font-bold">Привет! 👋</h1>
            <p class="text-xs text-gray-500">Версия 7.0 (Стабильная база)</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">🤖</div>
    </header>

    <!-- Основной контент (все экраны загружены сразу, но скрыты) -->
    <main class="flex-1 overflow-y-auto p-4 pb-20">
        
        <!-- ЭКРАН 1: ЗАМЕТКИ -->
        <div id="view-notes" class="space-y-4">
            <h2 class="text-lg font-bold">Заметки</h2>
            <textarea id="note-input" placeholder="Напишите мысль..." class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-emerald-500 h-28 resize-none"></textarea>
            <button onclick="addNote()" id="btn-add-note" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold">Сохранить</button>
            <div id="list-notes" class="space-y-2 mt-4"></div>
        </div>

        <!-- ЭКРАН 2: ЗАДАЧИ -->
        <div id="view-tasks" class="space-y-4 hidden-tab">
            <h2 class="text-lg font-bold">Задачи</h2>
            <div class="space-y-2">
                <input type="text" id="task-input" placeholder="Название задачи..." class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-emerald-500">
                <div class="flex gap-2">
                    <input type="datetime-local" id="task-deadline" class="w-full p-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="addTask()" id="btn-add-task" class="px-5 py-3 rounded-xl bg-emerald-600 text-white font-bold">+</button>
                </div>
            </div>
            <div id="list-tasks" class="space-y-2 mt-4"></div>
        </div>

        <!-- ЭКРАН 3: ГЕО-ЛОКАЦИИ -->
        <div id="view-geo" class="space-y-4 hidden-tab">
            <h2 class="text-lg font-bold">Места</h2>
            <input type="text" id="geo-input" placeholder="Название места..." class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-blue-500">
            <button onclick="addGeo()" id="btn-add-geo" class="w-full py-3 rounded-xl bg-blue-600 text-white font-bold">📍 Сохранить геопозицию</button>
            <div id="list-geo" class="space-y-2 mt-4"></div>
        </div>

    </main>

    <!-- Нижнее навигационное меню -->
    <nav class="absolute bottom-0 w-full bg-white border-t p-2 flex justify-around items-center z-50">
        <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center flex-1 py-1 text-emerald-600 font-bold">
            <span class="text-xl">📝</span><span class="text-xs">Заметки</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center flex-1 py-1 text-gray-400">
            <span class="text-xl">✅</span><span class="text-xs">Задачи</span>
        </button>
        <button onclick="switchTab('geo')" id="nav-geo" class="flex flex-col items-center flex-1 py-1 text-gray-400">
            <span class="text-xl">📍</span><span class="text-xs">Места</span>
        </button>
    </nav>

    <script>
        var tg = window.Telegram.WebApp;
        tg.expand();
        
        var telegramId = 'test_user';
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramId = String(tg.initDataUnsafe.user.id);
            document.getElementById('user-greeting').innerText = 'Привет, ' + tg.initDataUnsafe.user.first_name + '!';
        }

        var API_URL = 'https://my-assistant-backend-0a8k.onrender.com';

        // Простая функция переключения вкладок
        window.switchTab = function(tabName) {
            // Прячем всё
            document.getElementById('view-notes').className = 'space-y-4 hidden-tab';
            document.getElementById('view-tasks').className = 'space-y-4 hidden-tab';
            document.getElementById('view-geo').className = 'space-y-4 hidden-tab';
            
            // Делаем кнопки серыми
            document.getElementById('nav-notes').className = 'flex flex-col items-center flex-1 py-1 text-gray-400';
            document.getElementById('nav-tasks').className = 'flex flex-col items-center flex-1 py-1 text-gray-400';
            document.getElementById('nav-geo').className = 'flex flex-col items-center flex-1 py-1 text-gray-400';

            // Показываем нужное
            document.getElementById('view-' + tabName).className = 'space-y-4';
            var activeNavClass = 'flex flex-col items-center flex-1 py-1 text-emerald-600 font-bold';
            if(tabName === 'geo') {
                activeNavClass = 'flex flex-col items-center flex-1 py-1 text-blue-600 font-bold';
            }
            document.getElementById('nav-' + tabName).className = activeNavClass;

            // Загружаем данные вкладки
            if (tabName === 'notes') loadNotes();
            if (tabName === 'tasks') loadTasks();
            if (tabName === 'geo') loadGeo();
        };

        // --- ЛОГИКА ЗАМЕТОК ---
        window.addNote = function() {
            var input = document.getElementById('note-input');
            var btn = document.getElementById('btn-add-note');
            var text = input.value.trim();
            if (!text) return;
            
            btn.innerText = '...';
            btn.disabled = true;
            
            fetch(API_URL + '/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: telegramId, text: text })
            }).then(function() {
                input.value = '';
                btn.innerText = 'Сохранить';
                btn.disabled = false;
                loadNotes();
            }).catch(function() {
                btn.innerText = 'Ошибка';
                btn.disabled = false;
            });
        };

        window.loadNotes = function() {
            var list = document.getElementById('list-notes');
            list.innerHTML = '<p class="text-center text-gray-500">Загрузка...</p>';
            fetch(API_URL + '/notes?user_id=' + telegramId)
                .then(res => res.json())
                .then(function(notes) {
                    if (notes.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">Нет заметок</p>'; return; }
                    var html = '';
                    for (var i = notes.length - 1; i >= 0; i--) {
                        html += '<div class="p-3 bg-white rounded-xl shadow-sm border flex justify-between gap-2 items-center"><span class="break-words w-full">' + notes[i].text + '</span><button onclick="delNote(' + notes[i].id + ')" class="text-red-500 font-bold">Удалить</button></div>';
                    }
                    list.innerHTML = html;
                });
        };
        
        window.delNote = function(id) { fetch(API_URL + '/notes/' + id, { method: 'DELETE' }).then(loadNotes); };

        // --- ЛОГИКА ЗАДАЧ ---
        window.addTask = function() {
            var input = document.getElementById('task-input');
            var date = document.getElementById('task-deadline');
            var btn = document.getElementById('btn-add-task');
            var title = input.value.trim();
            if (!title) return;

            btn.innerText = '...';
            btn.disabled = true;

            fetch(API_URL + '/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: telegramId, title: title, deadline: date.value || null })
            }).then(function() {
                input.value = '';
                date.value = '';
                btn.innerText = '+';
                btn.disabled = false;
                loadTasks();
            });
        };

        window.loadTasks = function() {
            var list = document.getElementById('list-tasks');
            list.innerHTML = '<p class="text-center text-gray-500">Загрузка...</p>';
            fetch(API_URL + '/tasks?user_id=' + telegramId)
                .then(res => res.json())
                .then(function(tasks) {
                    if (tasks.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">Все выполнено</p>'; return; }
                    var html = '';
                    for (var i = tasks.length - 1; i >= 0; i--) {
                        var task = tasks[i];
                        var checked = task.status === 'done' ? 'checked' : '';
                        var lineClass = task.status === 'done' ? 'done-task' : '';
                        var deadlineText = '';
                        if (task.deadline) {
                            var d = new Date(task.deadline);
                            deadlineText = '<div class="text-xs text-gray-500 mt-1">🗓 До: ' + d.toLocaleString('ru-RU') + '</div>';
                        }
                        html += '<div class="p-3 bg-white rounded-xl shadow-sm border flex items-start gap-3"><input type="checkbox" class="mt-1" ' + checked + ' onchange="togTask(' + task.id + ', this.checked)"><div class="w-full"><span class="' + lineClass + '">' + task.title + '</span>' + deadlineText + '</div><button onclick="delTask(' + task.id + ')" class="text-red-500 font-bold">X</button></div>';
                    }
                    list.innerHTML = html;
                });
        };

        window.togTask = function(id, isDone) { fetch(API_URL + '/tasks/' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status: isDone ? 'done' : 'todo'}) }).then(loadTasks); };
        window.delTask = function(id) { fetch(API_URL + '/tasks/' + id, { method: 'DELETE' }).then(loadTasks); };

        // --- ЛОГИКА ГЕО ---
        window.addGeo = function() {
            var input = document.getElementById('geo-input');
            var btn = document.getElementById('btn-add-geo');
            var text = input.value.trim();
            if (!text) return;

            btn.innerText = 'Ищем...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(function(pos) {
                btn.innerText = 'Сохраняем...';
                fetch(API_URL + '/geo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: telegramId, text: text, lat: pos.coords.latitude, lng: pos.coords.longitude })
                }).then(function() {
                    input.value = '';
                    btn.innerText = '📍 Сохранить геопозицию';
                    btn.disabled = false;
                    loadGeo();
                });
            }, function() {
                alert('Не удалось получить координаты');
                btn.innerText = '📍 Сохранить геопозицию';
                btn.disabled = false;
            });
        };

        window.loadGeo = function() {
            var list = document.getElementById('list-geo');
            list.innerHTML = '<p class="text-center text-gray-500">Загрузка...</p>';
            fetch(API_URL + '/geo?user_id=' + telegramId)
                .then(res => res.json())
                .then(function(places) {
                    if (places.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">Нет мест</p>'; return; }
                    var html = '';
                    for (var i = places.length - 1; i >= 0; i--) {
                        var p = places[i];
                        html += '<div class="p-3 bg-white rounded-xl shadow-sm border flex flex-col gap-2"><div class="flex justify-between items-center"><span class="font-bold w-full">' + p.text + '</span><button onclick="delGeo(' + p.id + ')" class="text-red-500 text-sm">Удалить</button></div><a href="https://maps.google.com/?q=' + p.lat + ',' + p.lng + '" target="_blank" class="text-blue-600 text-sm underline">Отрыть на карте</a></div>';
                    }
                    list.innerHTML = html;
                });
        };
        
        window.delGeo = function(id) { fetch(API_URL + '/geo/' + id, { method: 'DELETE' }).then(loadGeo); };

        // Инициализация при старте
        loadNotes();
    </script>
</body>
</html>
