<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>brain. // Второй мозг</title>

  <!-- Шрифты Google Fonts с надёжными системными фолбэками -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Официальный Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Автономные стили: Swiss Editorial / Technical Neo-Minimalism -->
  <style>
    :root {
      --bg: #F6F6F4;
      --desk: #E8E8E3;
      --surface: #FFFFFF;
      --ink: #0D0D0D;
      --muted: #7A7A75;
      --border: #E2E2DE;
      --accent: #FF4422;
      --online: #16A34A;

      --font-display: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Строгий сброс: 0px углы, никаких теней и градиентов */
    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0px;
      box-shadow: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    @media (min-width: 520px) {
      body {
        background-color: var(--desk);
      }
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    /* Корневой контейнер приложения */
    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 520px) {
      .app {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }

    /* =========================================================
       ВЕРХНЯЯ ШАПКА И НАВИГАЦИЯ
       ========================================================= */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--ink);
      background-color: var(--bg);
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .status-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      display: inline-block;
      flex-shrink: 0;
      background-color: var(--accent);
    }

    .status-dot.is-online {
      background-color: var(--online);
    }

    .status-dot.is-syncing {
      background-color: var(--accent);
      animation: pulse-dot 0.9s infinite alternate;
    }

    .status-dot.is-error {
      background-color: var(--accent);
    }

    @keyframes pulse-dot {
      from { opacity: 1; }
      to { opacity: 0.25; }
    }

    .status-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .status-text.is-error {
      color: var(--accent);
    }

    .clock-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .clock-line {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .clock-value {
      color: var(--ink);
      font-weight: 600;
    }

    .btn-refresh {
      width: 22px;
      height: 22px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .btn-refresh:hover,
    .btn-refresh:active {
      background-color: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    .btn-refresh.is-spinning span {
      display: inline-block;
      animation: spin-icon 0.75s linear infinite;
    }

    @keyframes spin-icon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Горизонтальная индексная навигация */
    .tabs-nav {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      margin: 0;
      border: none;
      border-right: 1px solid var(--border);
      background-color: transparent;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .tab-btn:hover {
      background-color: var(--surface);
    }

    .tab-btn .tab-code {
      color: var(--muted);
    }

    .tab-btn .tab-dot {
      display: none;
      width: 5px;
      height: 5px;
      background-color: var(--accent);
      flex-shrink: 0;
    }

    .tab-btn.is-active {
      background-color: var(--ink);
      color: #FFFFFF;
      border-right-color: var(--ink);
    }

    .tab-btn.is-active .tab-code {
      color: rgba(255, 255, 255, 0.56);
    }

    .tab-btn.is-active .tab-dot {
      display: inline-block;
    }

    .tab-btn.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background-color: var(--accent);
    }

    /* =========================================================
       ОСНОВНОЙ КОНТЕНТ И ЗАГОЛОВКИ РАЗДЕЛОВ
       ========================================================= */
    .main-area {
      flex: 1 0 auto;
      padding-bottom: 92px;
    }

    .section-head {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--ink);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--bg);
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .section-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .section-index {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.05em;
      color: rgba(13, 13, 13, 0.14);
      user-select: none;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Панель фильтров задач */
    .sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background-color: var(--surface);
      flex-wrap: wrap;
    }

    .sub-bar-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sub-bar-label strong {
      color: var(--ink);
    }

    .filter-group {
      display: inline-flex;
      border: 1px solid var(--border);
    }

    .filter-btn {
      border: none;
      border-right: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      padding: 5px 9px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-btn:last-child {
      border-right: none;
    }

    .filter-btn.is-active {
      background-color: var(--ink);
      color: #FFFFFF;
    }

    /* Состояния загрузки и пустого списка */
    .state-box {
      padding: 48px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .state-code {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .state-sub {
      margin: 8px 0 0;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .loading-bar {
      width: 140px;
      height: 2px;
      background-color: var(--border);
      margin: 14px auto 0;
      overflow: hidden;
      position: relative;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      left: -45%;
      top: 0;
      width: 45%;
      height: 100%;
      background-color: var(--accent);
      animation: slide-bar 1.1s linear infinite;
    }

    @keyframes slide-bar {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    /* Общие карточки списка */
    .item-list {
      display: flex;
      flex-direction: column;
    }

    .item-card {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }

    .btn-delete {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 18px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .btn-delete:hover,
    .btn-delete:active {
      background-color: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    /* 01. ЗАДАЧИ */
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-row.is-done {
      background-color: var(--bg);
      opacity: 0.62;
    }

    .task-check {
      width: 22px;
      height: 22px;
      margin-top: 1px;
      flex-shrink: 0;
      border: 1px solid var(--ink);
      background-color: var(--surface);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .task-check.is-checked {
      background-color: var(--ink);
    }

    .task-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .task-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .task-row.is-done .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .mono-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mono-meta.is-urgent {
      color: var(--accent);
      font-weight: 600;
    }

    .badge-accent {
      display: inline-block;
      padding: 2px 6px;
      background-color: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* 02. ЗАМЕТКИ */
    .note-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .note-index {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .note-index strong {
      color: var(--ink);
    }

    .note-body {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 03. ПОДПИСКИ */
    .subs-summary {
      background-color: var(--ink);
      color: #FFFFFF;
      padding: 20px 16px;
      border-bottom: 1px solid var(--ink);
    }

    .subs-summary-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 6px;
    }

    .subs-total-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .subs-total-num {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subs-total-cur {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sub-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .sub-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .sub-day {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .sub-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .sub-price {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .sub-price span {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 3px;
    }

    /* 04. ССЫЛКИ */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .link-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .link-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .link-domain {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-square-open {
      width: 34px;
      height: 34px;
      border: none;
      background-color: var(--ink);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      transition: background-color 120ms ease;
    }

    .btn-square-open:hover,
    .btn-square-open:active {
      background-color: var(--accent);
    }

    /* 05. ДНЕВНИК */
    .diary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .diary-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mood-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid var(--ink);
      background-color: var(--bg);
      color: var(--ink);
    }

    .mood-tag.is-strong {
      background-color: var(--ink);
      color: #FFFFFF;
    }

    /* 06. ГЕО */
    .geo-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .geo-clickable {
      flex: 1 1 auto;
      min-width: 0;
      cursor: pointer;
    }

    .geo-code {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .geo-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .geo-coords {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin-top: 8px;
    }

    .geo-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: none;
      background-color: var(--ink);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-map:hover,
    .btn-map:active {
      background-color: var(--accent);
    }

    /* 07. СЧЁТЧИКИ */
    .cd-card {
      background-color: var(--surface);
      border-bottom: 1px solid var(--ink);
      padding: 16px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 14px;
    }

    .cd-left {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .cd-target {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .cd-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .cd-delete-link {
      align-self: flex-start;
      border: none;
      background: transparent;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }

    .cd-delete-link:hover {
      color: var(--accent);
    }

    .cd-right {
      flex-shrink: 0;
      min-width: 112px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      text-align: right;
    }

    .cd-number {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .cd-number.is-soon {
      color: var(--accent);
    }

    .cd-unit {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      margin-top: 6px;
    }

    .cd-unit.is-soon {
      color: var(--accent);
    }

    /* Нижний технический футер */
    .app-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);

    /* =========================================================
       КНОПКА ДОБАВЛЕНИЯ (+) — СТРОГО В ПРАВОМ НИЖНЕМ УГЛУ
       ========================================================= */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 54px;
      height: 54px;
      background-color: var(--accent);
      color: #FFFFFF;
      border: 1px solid var(--accent);
      border-radius: 0px;
      z-index: 50;
      display: flex;

    }

    .fab:hover,
    .fab:active {
      background-color: var(--ink);

    @media (min-width: 520px) {
      .fab {
        right: calc(50% - 224px);
      }
    }

    /* =========================================================
       АДАПТИВНАЯ ШТОРКА ДОБАВЛЕНИЯ (BOTTOM SHEET)
       ========================================================= */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background-color: rgba(13, 13, 13, 0.52);
      display: none;
      align-items: flex-end;

    }

    .sheet-overlay.is-open {
      display: flex;

    .sheet-modal {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      background-color: var(--bg);
      border-top: 2px solid var(--ink);

    @media (min-width: 520px) {
      .sheet-modal {

    .sheet-header {

    .sheet-title {

    .sheet-close {
      width: 32px;

    .sheet-close:hover {

    .sheet-form {
      padding: 16px;

    .field-group {

      font-family: var(--font-mono);

    .form-notice {

    .btn-submit {

    /* Нижний системный тост (не перекрывает кнопку + справа) */
    .toast {
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: calc(100vw - 92px);
      z-index: 300;
      background-color: var(--ink);

    @media (min-width: 520px) {

        left: calc(50% - 224px);
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app-root">
    <!-- Закреплённая техническая шапка и навигация по 7 модулям -->
    <div class="sticky-top">
      <header class="app-header">
        <div class="brand-group">
          <h1 class="brand-title">brain.</h1>
          <div class="brand-sub">ВТОРОЙ МОЗГ // SYS 01</div>
        </div>
        <div class="header-right">
          <div class="status-row">
            <span id="status-dot" class="status-dot is-syncing" aria-hidden="true"></span>
            <span id="status-text" class="status-text">СИНХРОНИЗАЦИЯ...</span>
          </div>
          <div class="clock-row">
            <div class="clock-line">
              <span id="live-clock" class="clock-value">00:00:00</span>
            </div>
            <button type="button" id="refresh-btn" class="btn-refresh" title="Обновить данные" aria-label="Обновить данные">
              <span>↻</span>
            </button>
          </div>
        </div>
      </header>

      <nav id="tabs-nav" class="tabs-nav" aria-label="Навигация по модулям"></nav>
    </div>

    <!-- Основная область активного модуля -->
    <main id="main-area" class="main-area"></main>

    <!-- Технический футер -->
    <footer class="app-footer">
      <span>BRAIN. // RENDER API</span>
      <span id="user-badge">UID // —</span>
    </footer>
  </div>

  <!-- Фиксированная квадратная кнопка добавления (+) -->
  <button type="button" id="fab-btn" class="fab" aria-label="Добавить запись">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- Адаптивная шторка добавления (Bottom Sheet) -->
  <div id="sheet-overlay" class="sheet-overlay" aria-hidden="true">
    <div class="sheet-modal" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-header">
        <div class="sheet-title-wrap">
          <span class="status-dot" aria-hidden="true"></span>
          <h2 id="sheet-title" class="sheet-title">НОВАЯ ЗАПИСЬ</h2>
        </div>
        <button type="button" id="sheet-close-btn" class="sheet-close" aria-label="Закрыть">×</button>
      </div>

      <form id="sheet-form" class="sheet-form" novalidate>
        <div id="sheet-fields"></div>
        <div id="form-notice" class="form-notice"></div>
        <button type="submit" id="sheet-submit-btn" class="btn-submit">
          <span id="sheet-submit-label">СОХРАНИТЬ</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Нижний тост-уведомление -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- =========================================================
       КЛИЕНТСКАЯ ЛОГИКА И ИНТЕГРАЦИЯ С FASTAPI НА RENDER
       ========================================================= -->
  <script>
    (function () {
      'use strict';

      /* ---------------------------------------------------------
         1. КОНФИГУРАЦИЯ API И TELEGRAM WEBAPP SDK
         --------------------------------------------------------- */
      const API_BASE = 'https://my-assistant-backend-0a8k.onrender.com';

      const TelegramBridge = {
        getApp() {
          try {
            if (window.Telegram && window.Telegram.WebApp) {
              return window.Telegram.WebApp;
            }
          } catch (e) {}
          return null;
        },

        init() {
          try {
            const tg = this.getApp();
            if (!tg) return;
            if (typeof tg.ready === 'function') tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#F6F6F4');
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#F6F6F4');
          } catch (e) {
            console.warn('Telegram WebApp init skipped:', e);
          }
        },

        getUserId() {
          try {
            const id = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
            return String(id || 'demo_user');
          } catch (e) {
            return 'demo_user';
          }
        },

        openExternal(url) {
          const safeUrl = normalizeUrl(url);
          if (!safeUrl) return;
          try {
            const tg = this.getApp();
            if (tg && typeof tg.openLink === 'function') {
              tg.openLink(safeUrl);
              return;
            }
          } catch (e) {
            console.warn('tg.openLink fallback:', e);
          }
          window.open(safeUrl, '_blank', 'noopener,noreferrer');
        },

        haptic(style) {
          try {
            const tg = this.getApp();
            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
              tg.HapticFeedback.impactOccurred(style || 'light');
            }
          } catch (e) {}
        }
      };

      /* ---------------------------------------------------------
         2. МЕТАДАННЫЕ 7 МОДУЛЕЙ И СОСТОЯНИЕ ПРИЛОЖЕНИЯ
         --------------------------------------------------------- */
      const MODULES = [
        { id: 'tasks',      code: '01', nav: 'ЗАДАЧИ',   title: 'задачи.',   eyebrow: 'ДЕДЛАЙНЫ И ПРИОРИТЕТЫ' },
        { id: 'notes',      code: '02', nav: 'ЗАМЕТКИ',  title: 'заметки.',  eyebrow: 'БУФЕР МЫСЛЕЙ И ТЕЗИСОВ' },
        { id: 'subs',       code: '03', nav: 'ПОДПИСКИ', title: 'подписки.', eyebrow: 'ЕЖЕМЕСЯЧНЫЕ СПИСАНИЯ' },
        { id: 'links',      code: '04', nav: 'ССЫЛКИ',   title: 'ссылки.',   eyebrow: 'АРХИВ ЗАКЛАДОК' },
        { id: 'diary',      code: '05', nav: 'ДНЕВНИК',  title: 'дневник.',  eyebrow: 'БОРТОВОЙ ЖУРНАЛ' },
        { id: 'geo',        code: '06', nav: 'ГЕО',      title: 'гео.',      eyebrow: 'СОХРАНЁННЫЕ ТОЧКИ' },
        { id: 'countdowns', code: '07', nav: 'СЧЁТЧИКИ', title: 'счётчики.', eyebrow: 'ОБРАТНЫЙ ОТСЧЁТ' }
      ];

      const MOOD_TAGS = ['[ФОКУС]', '[СПОКОЙСТВИЕ]', '[ЭНЕРГИЯ]', '[УСТАЛОСТЬ]'];

      const appState = {
        userId: 'demo_user',
        activeModule: 'tasks',
        taskFilter: 'all', // all | active | done
        selectedMood: MOOD_TAGS[0],
        initialLoading: true,
        isSyncing: false,
        isSubmitting: false,
        connectionStatus: 'syncing', // syncing | online | error
        toastTimer: null,
        data: {
          tasks: [],
          notes: [],
          subs: [],
          links: [],
          diary: [],
          geo: [],
          countdowns: []
        }
      };

      /* ---------------------------------------------------------
         3. СЕТЕВОЙ СЛОЙ (FETCH К FASTAPI)
         --------------------------------------------------------- */
      async function apiRequest(path, options = {}) {
        const response = await fetch(`${API_BASE}${path}`, {
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          },
          ...options
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          return response.json();
        }
        return null;
      }

      async function fetchModule(moduleId) {
        const uid = encodeURIComponent(appState.userId);
        const list = await apiRequest(`/${moduleId}?user_id=${uid}`, { method: 'GET' });
        appState.data[moduleId] = Array.isArray(list) ? list : [];
        return appState.data[moduleId];
      }

      async function syncAllModules(isManual = false) {
        if (appState.isSyncing) return;
        appState.isSyncing = true;
        setConnectionStatus('syncing');

        const refreshBtn = document.getElementById('refresh-btn');
        if (refreshBtn) {
          refreshBtn.disabled = true;
          refreshBtn.classList.add('is-spinning');
        }

        const results = await Promise.allSettled(
          MODULES.map((mod) => fetchModule(mod.id))
        );

        const failedCount = results.filter((r) => r.status === 'rejected').length;

        appState.initialLoading = false;
        appState.isSyncing = false;

        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.classList.remove('is-spinning');
        }

        if (failedCount === MODULES.length) {
          setConnectionStatus('error');
          showToast('ОШИБКА СЕТИ: СЕРВЕР НЕ ОТВЕЧАЕТ', true);
        } else if (failedCount > 0) {
          setConnectionStatus('error');
          showToast(`ЧАСТИЧНЫЙ СБОЙ СИНХРОНИЗАЦИИ (${failedCount})`, true);
        } else {
          setConnectionStatus('online');
          if (isManual) {
            showToast('ДАННЫЕ ОБНОВЛЕНЫ');
          }
        }

        renderApp();
      }

      function setConnectionStatus(status) {
        appState.connectionStatus = status;
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (!dot || !text) return;

        dot.className = 'status-dot';
        text.className = 'status-text';

        if (status === 'syncing') {
          dot.classList.add('is-syncing');
          text.textContent = 'СИНХРОНИЗАЦИЯ...';
        } else if (status === 'online') {
          dot.classList.add('is-online');
          const modeSuffix = appState.userId === 'demo_user' ? ' [DEMO]' : '';
          text.textContent = `ОНЛАЙН // 7 МОДУЛЕЙ${modeSuffix}`;
        } else {
          dot.classList.add('is-error');
          text.classList.add('is-error');
          text.textContent = 'ОШИБКА СЕТИ';
        }
      }

      /* ---------------------------------------------------------
         4. УТИЛИТЫ ФОРМАТИРОВАНИЯ, ДАТ И БЕЗОПАСНОСТИ
         --------------------------------------------------------- */
      function pad2(num) {
        return num < 10 ? '0' + num : String(num);
      }

      function todayDDMMYYYY() {
        const now = new Date();
        return `${pad2(now.getDate())}.${pad2(now.getMonth() + 1)}.${now.getFullYear()}`;
      }

      function relativeDateISO(daysOffset) {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + daysOffset);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      }

      function escapeHtml(val) {
        return String(val === null || val === undefined ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateTime(isoStr) {
        if (!isoStr) return 'БЕЗ ДЕДЛАЙНА';
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return String(isoStr);
        return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()} // ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      }

      function formatDateOnly(dateStr) {
        if (!dateStr) return '—';
        const parts = String(dateStr).split('-');
        if (parts.length === 3) {
          return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return String(dateStr);
      }

      function getTaskDeadlineBadge(task) {
        if (task.status === 'done' || !task.deadline) return null;
        const targetMs = new Date(task.deadline).getTime();
        if (isNaN(targetMs)) return null;
        const diffMs = targetMs - Date.now();
        if (diffMs < 0) return { label: 'ПРОСРОЧЕНО', urgent: true };
        if (diffMs <= 24 * 3600 * 1000) return { label: 'СКОРО', urgent: true };
        return null;
      }

      function normalizeUrl(raw) {
        const trimmed = String(raw || '').trim();
        if (!trimmed) return '';
        return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
      }

      function extractDomain(raw) {
        try {
          const u = new URL(normalizeUrl(raw));
          return u.hostname.replace(/^www\./i, '');
        } catch (e) {
          return String(raw || '').replace(/^https?:\/\//i, '').split('/')[0] || '—';
        }
      }

      function formatCoords(lat, lng) {
        const nLat = Number(lat);
        const nLng = Number(lng);
        if (isNaN(nLat) || isNaN(nLng)) return '—';
        const latDir = nLat >= 0 ? 'N' : 'S';
        const lngDir = nLng >= 0 ? 'E' : 'W';
        return `${Math.abs(nLat).toFixed(4)}° ${latDir} / ${Math.abs(nLng).toFixed(4)}° ${lngDir}`;
      }

      function calcDaysRemaining(targetDateStr) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const parts = String(targetDateStr || '').split('-');
        if (parts.length !== 3) return null;
        const target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (isNaN(target.getTime())) return null;
        target.setHours(0, 0, 0, 0);
        return Math.round((target.getTime() - today.getTime()) / (24 * 3600 * 1000));
      }

      function pluralizeSubs(n) {
        const mod100 = Math.abs(n) % 100;
        const mod10 = mod100 % 10;
        if (mod100 > 10 && mod100 < 20) return 'ПОДПИСОК';
        if (mod10 === 1) return 'ПОДПИСКА';
        if (mod10 >= 2 && mod10 <= 4) return 'ПОДПИСКИ';
        return 'ПОДПИСОК';
      }

      function showToast(message, isError = false) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.className = 'toast is-visible' + (isError ? ' is-error' : '');
        if (appState.toastTimer) clearTimeout(appState.toastTimer);
        appState.toastTimer = setTimeout(() => {
          el.classList.remove('is-visible');
        }, isError ? 3200 : 2000);
      }

      function updateLiveClock() {
        const clockEl = document.getElementById('live-clock');
        if (!clockEl) return;
        const now = new Date();
        clockEl.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
      }

      /* ---------------------------------------------------------
         5. РЕНДЕР НАВИГАЦИИ И ВСЕХ 7 МОДУЛЕЙ
         --------------------------------------------------------- */
      function renderTabs() {
        const nav = document.getElementById('tabs-nav');
        if (!nav) return;

        nav.innerHTML = MODULES.map((mod) => {
          const activeClass = mod.id === appState.activeModule ? ' is-active' : '';
          return (
            `<button type="button" class="tab-btn${activeClass}" data-tab="${mod.id}">` +
              `<span class="tab-dot" aria-hidden="true"></span>` +
              `<span class="tab-code">${mod.code}</span>` +
              `<span>${mod.nav}</span>` +
            `</button>`
          );
        }).join('');

        const activeBtn = nav.querySelector('.tab-btn.is-active');
        if (activeBtn && typeof activeBtn.scrollIntoView === 'function') {
          try {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          } catch (e) {}
        }
      }

      function renderSectionHead(mod, countLabel) {
        return (
          `<section class="section-head">` +
            `<div>` +
              `<div class="section-eyebrow">${mod.eyebrow}</div>` +
              `<h2 class="section-title">${mod.title}</h2>` +
            `</div>` +
            `<div class="section-meta">` +
              `<div class="section-index">${mod.code}</div>` +
              `<div class="section-count">${countLabel}</div>` +
            `</div>` +
          `</section>`
        );
      }

      function renderLoadingState() {
        return (
          `<div class="state-box">` +
            `<div class="state-code">` +
              `<span class="status-dot is-syncing" aria-hidden="true"></span>` +
              `<span>ЗАГРУЗКА ДАННЫХ...</span>` +
            `</div>` +
            `<div class="state-sub">ПОДКЛЮЧЕНИЕ К СЕРВЕРУ RENDER</div>` +
            `<div class="loading-bar" aria-hidden="true"></div>` +
          `</div>`
        );
      }

      function renderEmptyState() {
        return (
          `<div class="state-box">` +
            `<div class="state-code">НЕТ ЗАПИСЕЙ // НАЖМИТЕ +</div>` +
          `</div>`
        );
      }

      /* 01. ЗАДАЧИ */
      function renderTasks(mod) {
        const allTasks = appState.data.tasks;
        const activeCount = allTasks.filter((t) => t.status !== 'done').length;

        const filtered = allTasks
          .filter((t) => {
            if (appState.taskFilter === 'active') return t.status !== 'done';
            if (appState.taskFilter === 'done') return t.status === 'done';
            return true;
          })
          .slice()
          .sort((a, b) => Number(a.status === 'done') - Number(b.status === 'done'));

        const subBar =
          `<div class="sub-bar">` +
            `<div class="sub-bar-label">АКТИВНЫХ: <strong>${activeCount}</strong> // ВСЕГО: <strong>${allTasks.length}</strong></div>` +
            `<div class="filter-group" role="group" aria-label="Фильтр задач">` +
              `<button type="button" class="filter-btn${appState.taskFilter === 'all' ? ' is-active' : ''}" data-task-filter="all">ВСЕ</button>` +
              `<button type="button" class="filter-btn${appState.taskFilter === 'active' ? ' is-active' : ''}" data-task-filter="active">В РАБОТЕ</button>` +
              `<button type="button" class="filter-btn${appState.taskFilter === 'done' ? ' is-active' : ''}" data-task-filter="done">ГОТОВО</button>` +
            `</div>` +
          `</div>`;

        let bodyHtml = '';
        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (filtered.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + filtered.map((task) => {
            const isDone = task.status === 'done';
            const badge = getTaskDeadlineBadge(task);
            const checkIcon = isDone
              ? '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="3 8.5 6.5 12 13 4.5"></polyline></svg>'
              : '';

            return (
              `<article class="item-card task-row${isDone ? ' is-done' : ''}">` +
                `<button type="button" class="task-check${isDone ? ' is-checked' : ''}" data-action="toggle-task" data-id="${escapeHtml(task.id)}" data-status="${escapeHtml(task.status)}" aria-label="Переключить статус задачи">` +
                  checkIcon +
                `</button>` +
                `<div class="task-body">` +
                  `<p class="task-title">${escapeHtml(task.title)}</p>` +
                  `<div class="task-meta">` +
                    `<span class="mono-meta${badge ? ' is-urgent' : ''}">${formatDateTime(task.deadline)}</span>` +
                    (badge ? `<span class="badge-accent">${badge.label}</span>` : '') +
                  `</div>` +
                `</div>` +
                `<button type="button" class="btn-delete" data-action="delete" data-module="tasks" data-id="${escapeHtml(task.id)}" aria-label="Удалить задачу">×</button>` +
              `</article>`
            );
          }).join('') + '</div>';
        }

        return renderSectionHead(mod, `АКТИВНЫХ: ${pad2(activeCount)}`) + subBar + bodyHtml;
      }

      /* 02. ЗАМЕТКИ */
      function renderNotes(mod) {
        const notes = appState.data.notes;
        let bodyHtml = '';

        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (notes.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + notes.map((note, idx) => (
            `<article class="item-card">` +
              `<div class="note-head">` +
                `<div class="note-index"><strong>#${pad2(idx + 1)}</strong> // ID:${escapeHtml(note.id)}</div>` +
                `<button type="button" class="btn-delete" data-action="delete" data-module="notes" data-id="${escapeHtml(note.id)}" aria-label="Удалить заметку">×</button>` +
              `</div>` +
              `<p class="note-body">${escapeHtml(note.text)}</p>` +
            `</article>`
          )).join('') + '</div>';
        }

        return renderSectionHead(mod, `ЗАПИСЕЙ: ${pad2(notes.length)}`) + bodyHtml;
      }

      /* 03. ПОДПИСКИ */
      function renderSubs(mod) {
        const subs = appState.data.subs;
        const total = subs.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const summaryHtml =
          `<div class="subs-summary">` +
            `<div class="subs-summary-label">ИТОГО В МЕСЯЦ // ${subs.length} ${pluralizeSubs(subs.length)}</div>` +
            `<div class="subs-total-row">` +
              `<span class="subs-total-num">${total.toFixed(2)}</span>` +
              `<span class="subs-total-cur">BYN / РУБ.</span>` +
            `</div>` +
          `</div>`;

        let bodyHtml = '';
        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (subs.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + subs.map((sub) => (
            `<article class="item-card sub-row">` +
              `<div class="sub-info">` +
                `<h3 class="sub-name">${escapeHtml(sub.title)}</h3>` +
                `<div class="sub-day">${escapeHtml(sub.pay_day)} ЧИСЛА</div>` +
              `</div>` +
              `<div class="sub-right">` +
                `<div class="sub-price">${Number(sub.amount || 0).toFixed(2)}<span>BYN</span></div>` +
                `<button type="button" class="btn-delete" data-action="delete" data-module="subs" data-id="${escapeHtml(sub.id)}" aria-label="Удалить подписку">×</button>` +
              `</div>` +
            `</article>`
          )).join('') + '</div>';
        }

        return renderSectionHead(mod, `АКТИВНО: ${pad2(subs.length)}`) + summaryHtml + bodyHtml;
      }

      /* 04. ССЫЛКИ */
      function renderLinks(mod) {
        const links = appState.data.links;
        let bodyHtml = '';

        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (links.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + links.map((link) => {
            const safeUrl = normalizeUrl(link.url);
            const domain = extractDomain(safeUrl);
            return (
              `<article class="item-card link-row">` +
                `<div class="link-info">` +
                  `<h3 class="link-title">${escapeHtml(link.title)}</h3>` +
                  `<div class="link-domain">${escapeHtml(domain)}</div>` +
                `</div>` +
                `<div class="link-actions">` +
                  `<button type="button" class="btn-square-open" data-action="open-link" data-url="${escapeHtml(safeUrl)}" aria-label="Открыть ссылку">↗</button>` +
                  `<button type="button" class="btn-delete" data-action="delete" data-module="links" data-id="${escapeHtml(link.id)}" aria-label="Удалить ссылку">×</button>` +
                `</div>` +
              `</article>`
            );
          }).join('') + '</div>';
        }

        return renderSectionHead(mod, `ССЫЛОК: ${pad2(links.length)}`) + bodyHtml;
      }

      /* 05. ДНЕВНИК */
      function renderDiary(mod) {
        const entries = appState.data.diary;
        let bodyHtml = '';

        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (entries.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + entries.map((entry) => {
            const moodVal = String(entry.mood || '—');
            const isStrong = moodVal === '[ФОКУС]' || moodVal === '[ЭНЕРГИЯ]';
            return (
              `<article class="item-card">` +
                `<div class="diary-head">` +
                  `<div class="diary-tags">` +
                    `<span class="mono-meta">${escapeHtml(entry.date_str || '—')}</span>` +
                    `<span class="mood-tag${isStrong ? ' is-strong' : ''}">${escapeHtml(moodVal)}</span>` +
                  `</div>` +
                  `<button type="button" class="btn-delete" data-action="delete" data-module="diary" data-id="${escapeHtml(entry.id)}" aria-label="Удалить запись">×</button>` +
                `</div>` +
                `<p class="note-body">${escapeHtml(entry.text)}</p>` +
              `</article>`
            );
          }).join('') + '</div>';
        }

        return renderSectionHead(mod, `ЗАПИСЕЙ: ${pad2(entries.length)}`) + bodyHtml;
      }

      /* 06. ГЕО */
      function renderGeo(mod) {
        const points = appState.data.geo;
        let bodyHtml = '';

        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (points.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + points.map((pt, idx) => {
            const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(pt.lat)},${encodeURIComponent(pt.lng)}`;
            return (
              `<article class="item-card">` +
                `<div class="geo-top">` +
                  `<div class="geo-clickable" data-action="open-link" data-url="${escapeHtml(mapUrl)}">` +
                    `<div class="geo-code">LOC_${pad2(idx + 1)}</div>` +
                    `<h3 class="geo-name">${escapeHtml(pt.text)}</h3>` +
                    `<div class="geo-coords">${formatCoords(pt.lat, pt.lng)}</div>` +
                  `</div>` +
                  `<button type="button" class="btn-delete" data-action="delete" data-module="geo" data-id="${escapeHtml(pt.id)}" aria-label="Удалить точку">×</button>` +
                `</div>` +
                `<div class="geo-footer">` +
                  `<button type="button" class="btn-map" data-action="open-link" data-url="${escapeHtml(mapUrl)}">ОТКРЫТЬ КАРТУ ↗</button>` +
                `</div>` +
              `</article>`
            );
          }).join('') + '</div>';
        }

        return renderSectionHead(mod, `ТОЧЕК: ${pad2(points.length)}`) + bodyHtml;
      }

      /* 07. СЧЁТЧИКИ */
      function renderCountdowns(mod) {
        const items = appState.data.countdowns.slice().sort((a, b) => {
          const da = calcDaysRemaining(a.target_date);
          const db = calcDaysRemaining(b.target_date);
          return (da === null ? 99999 : da) - (db === null ? 99999 : db);
        });

        let bodyHtml = '';
        if (appState.initialLoading) {
          bodyHtml = renderLoadingState();
        } else if (items.length === 0) {
          bodyHtml = renderEmptyState();
        } else {
          bodyHtml = '<div class="item-list">' + items.map((cd) => {
            const days = calcDaysRemaining(cd.target_date);
            let displayNum = '—';
            let unitText = 'ДАТА';
            let isSoon = false;

            if (days !== null) {
              if (days === 0) {
                displayNum = '00';
                unitText = 'СЕГОДНЯ';
                isSoon = true;
              } else if (days < 0) {
                displayNum = String(Math.abs(days));
                unitText = `ПРОШЛО ${Math.abs(days)} ДН.`;
                isSoon = true;
              } else {
                displayNum = days < 10 ? pad2(days) : String(days);
                unitText = 'ОСТАЛОСЬ ДН.';
                isSoon = days <= 7;
              }
            }

            return (
              `<article class="cd-card">` +
                `<div class="cd-left">` +
                  `<div>` +
                    `<div class="cd-target">ЦЕЛЬ // ${formatDateOnly(cd.target_date)}</div>` +
                    `<h3 class="cd-title">${escapeHtml(cd.title)}</h3>` +
                  `</div>` +
                  `<button type="button" class="cd-delete-link" data-action="delete" data-module="countdowns" data-id="${escapeHtml(cd.id)}">[ УДАЛИТЬ × ]</button>` +
                `</div>` +
                `<div class="cd-right">` +
                  `<div class="cd-number${isSoon ? ' is-soon' : ''}">${displayNum}</div>` +
                  `<div class="cd-unit${isSoon ? ' is-soon' : ''}">${unitText}</div>` +
                `</div>` +
              `</article>`
            );
          }).join('') + '</div>';
        }

        return renderSectionHead(mod, `СОБЫТИЙ: ${pad2(items.length)}`) + bodyHtml;
      }

      function renderApp() {
        renderTabs();
        const mod = MODULES.find((m) => m.id === appState.activeModule) || MODULES[0];
        const main = document.getElementById('main-area');
        if (!main) return;

        let html = '';
        if (mod.id === 'tasks') html = renderTasks(mod);
        else if (mod.id === 'notes') html = renderNotes(mod);
        else if (mod.id === 'subs') html = renderSubs(mod);
        else if (mod.id === 'links') html = renderLinks(mod);
        else if (mod.id === 'diary') html = renderDiary(mod);
        else if (mod.id === 'geo') html = renderGeo(mod);
        else if (mod.id === 'countdowns') html = renderCountdowns(mod);

        main.innerHTML = html;
      }

      /* ---------------------------------------------------------
         6. ШТОРКА ДОБАВЛЕНИЯ (BOTTOM SHEET)
         --------------------------------------------------------- */
      function setFormNotice(msg, isError = false) {
        const box = document.getElementById('form-notice');
        if (!box) return;
        if (!msg) {
          box.textContent = '';
          box.className = 'form-notice';
          return;
        }
        box.textContent = msg;
        box.className = 'form-notice is-visible' + (isError ? ' is-error' : '');
      }

      function setSubmitState(submitting) {
        appState.isSubmitting = submitting;
        const btn = document.getElementById('sheet-submit-btn');
        const label = document.getElementById('sheet-submit-label');
        if (btn) btn.disabled = submitting;
        if (label) label.textContent = submitting ? 'СОХРАНЕНИЕ...' : 'СОХРАНИТЬ';
      }

      function buildModalFields(moduleId) {
        if (moduleId === 'tasks') {
          return (
            `<div class="field-group">` +
              `<label class="field-label" for="inp-task-title">НАЗВАНИЕ ЗАДАЧИ *</label>` +
              `<input id="inp-task-title" name="title" type="text" class="field-input" placeholder="Например: Позвонить в студию" required />` +
            `</div>` +
            `<div class="field-group" style="margin-top:14px;">` +
              `<label class="field-label" for="inp-task-deadline">ДЕДЛАЙН (НЕОБЯЗАТЕЛЬНО)</label>` +
              `<input id="inp-task-deadline" name="deadline" type="datetime-local" class="field-input is-mono" />` +
            `</div>`
          );
        }

        if (moduleId === 'notes') {
          return (
            `<div class="field-group">` +
              `<label class="field-label" for="inp-note-text">ТЕКСТ ЗАМЕТКИ *</label>` +
              `<textarea id="inp-note-text" name="text" class="field-textarea" placeholder="Запишите мысль, идею или короткую заметку..." required></textarea>` +
            `</div>`
          );
        }

        if (moduleId === 'subs') {
          return (
            `<div class="field-group">` +
              `<label class="field-label" for="inp-sub-title">НАЗВАНИЕ ПОДПИСКИ *</label>` +
              `<input id="inp-sub-title" name="title" type="text" class="field-input" placeholder="Например: Telegram Premium, Яндекс Плюс" required />` +
            `</div>` +
            `<div class="field-row-2" style="margin-top:14px;">` +
              `<div class="field-group">` +
                `<label class="field-label" for="inp-sub-amount">СУММА (BYN / РУБ.) *</label>` +
                `<input id="inp-sub-amount" name="amount" type="number" step="0.01" min="0.01" class="field-input is-mono" placeholder="15.00" required />` +
              `</div>` +
              `<div class="field-group">` +
                `<label class="field-label" for="inp-sub-day">ДЕНЬ СПИСАНИЯ (1–31) *</label>` +
                `<input id="inp-sub-day" name="pay_day" type="number" min="1" max="31" class="field-input is-mono" placeholder="15" required />` +
              `</div>` +
            `</div>`
          );
        }

        if (moduleId === 'links') {
          return (
            `<div class="field-group">` +
              `<label class="field-label" for="inp-link-title">НАЗВАНИЕ *</label>` +
              `<input id="inp-link-title" name="title" type="text" class="field-input" placeholder="Например: Документация FastAPI" required />` +
            `</div>` +
            `<div class="field-group" style="margin-top:14px;">` +
              `<label class="field-label" for="inp-link-url">URL-АДРЕС *</label>` +
              `<input id="inp-link-url" name="url" type="url" class="field-input is-mono" placeholder="https://example.com" required />` +
            `</div>`
          );
        }

        if (moduleId === 'diary') {
          appState.selectedMood = MOOD_TAGS[0];
          return (
            `<div class="field-group">` +
              `<span class="field-label">СОСТОЯНИЕ</span>` +
              `<div class="mood-grid" id="mood-grid">` +
                MOOD_TAGS.map((tag, idx) => (
                  `<button type="button" class="mood-btn${idx === 0 ? ' is-selected' : ''}" data-mood="${tag}">${tag}</button>`
                )).join('') +
              `</div>` +
            `</div>` +
            `<div class="field-group" style="margin-top:14px;">` +
              `<label class="field-label" for="inp-diary-date">ДАТА (ДД.ММ.ГГГГ)</label>` +
              `<input id="inp-diary-date" name="date_str" type="text" class="field-input is-mono" value="${todayDDMMYYYY()}" />` +
            `</div>` +
            `<div class="field-group" style="margin-top:14px;">` +
              `<label class="field-label" for="inp-diary-text">ЗАПИСЬ В ДНЕВНИК *</label>` +
              `<textarea id="inp-diary-text" name="text" class="field-textarea" placeholder="Главные мысли или итоги дня..." required></textarea>` +
            `</div>`

        if (moduleId === 'geo') {

              `<label class="field-label" for="inp-geo-text">ОПИСАНИЕ МЕСТА *</label>` +
              `<input id="inp-geo-text" name="text" type="text" class="field-input" placeholder="Например: Тихая кофейня с розетками" required />` +
            `</div>` +
            `<div class="field-row-2" style="margin-top:14px;">` +
              `<div class="field-group">` +
                `<label class="field-label" for="inp-geo-lat">ШИРОТА (LAT) *</label>` +
                `<input id="inp-geo-lat" name="lat" type="number" step="any" class="field-input is-mono" placeholder="53.9006" required />` +
              `</div>` +
              `<div class="field-group">` +
                `<label class="field-label" for="inp-geo-lng">ДОЛГОТА (LNG) *</label>` +
                `<input id="inp-geo-lng" name="lng" type="number" step="any" class="field-input is-mono" placeholder="27.5590" required />` +
              `</div>` +
            `</div>` +
            `<div style="margin-top:14px;">` +
              `<button type="button" id="geo-locate-btn" class="btn-secondary">` +
                `<span class="status-dot" aria-hidden="true"></span>` +
                `<span>ОПРЕДЕЛИТЬ ГЕОПОЗИЦИЮ</span>` +
              `</button>` +

          );

        if (moduleId === 'countdowns') {
          return (
            `<div class="field-group">` +
              `<label class="field-label" for="inp-cd-title">НАЗВАНИЕ СОБЫТИЯ *</label>` +
              `<input id="inp-cd-title" name="title" type="text" class="field-input" placeholder="Например: Дедлайн проекта" required />` +
            `</div>` +
            `<div class="field-group" style="margin-top:14px;">` +

      function openSheet() {
        const mod = MODULES.find((m) => m.id === appState.activeModule) || MODULES[0];
        document.getElementById('sheet-title').textContent = `+ ${mod.code} ${mod.nav}`;
        document.getElementById('sheet-fields').innerHTML = buildModalFields(mod.id);
        setFormNotice('', false);
        setSubmitState(false);

        const overlay = document.getElementById('sheet-overlay');
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        TelegramBridge.haptic('light');

        setTimeout(() => {
          const first = document.querySelector('#sheet-fields input, #sheet-fields textarea');
          if (first) first.focus();
        }, 60);
      }

      function closeSheet() {
        if (appState.isSubmitting) return;
        const overlay = document.getElementById('sheet-overlay');
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        setFormNotice('', false);
      }

      async function handleSheetSubmit(event) {
        event.preventDefault();
        if (appState.isSubmitting) return;
        setFormNotice('', false);

        const fd = new FormData(event.currentTarget);
        const mod = appState.activeModule;
        let payload = null;

        if (mod === 'tasks') {
          const title = String(fd.get('title') || '').trim();
          const deadlineRaw = String(fd.get('deadline') || '').trim();
          if (!title) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ ЗАДАЧИ', true);
          payload = {
            user_id: appState.userId,
            title,
            deadline: deadlineRaw || null
          };
        } else if (mod === 'notes') {
          const text = String(fd.get('text') || '').trim();
          if (!text) return setFormNotice('ВВЕДИТЕ ТЕКСТ ЗАМЕТКИ', true);
          payload = { user_id: appState.userId, text };
        } else if (mod === 'subs') {
          const title = String(fd.get('title') || '').trim();
          const amount = parseFloat(fd.get('amount'));
          const pay_day = parseInt(fd.get('pay_day'), 10);
          if (!title) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ ПОДПИСКИ', true);
          if (isNaN(amount) || amount <= 0) return setFormNotice('УКАЖИТЕ КОРРЕКТНУЮ СУММУ', true);
          if (isNaN(pay_day) || pay_day < 1 || pay_day > 31) return setFormNotice('ДЕНЬ СПИСАНИЯ: ОТ 1 ДО 31', true);
          payload = { user_id: appState.userId, title, amount, pay_day };
        } else if (mod === 'links') {
          const title = String(fd.get('title') || '').trim();
          const url = normalizeUrl(fd.get('url'));
          if (!title) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ ССЫЛКИ', true);
          if (!url || url === 'https://') return setFormNotice('ВВЕДИТЕ КОРРЕКТНЫЙ URL', true);
          payload = { user_id: appState.userId, url, title };
        } else if (mod === 'diary') {
          const text = String(fd.get('text') || '').trim();
          const date_str = String(fd.get('date_str') || '').trim() || todayDDMMYYYY();
          if (!text) return setFormNotice('ВВЕДИТЕ ТЕКСТ ЗАПИСИ', true);
          payload = {
            user_id: appState.userId,
            mood: appState.selectedMood || MOOD_TAGS[0],
            text,
            date_str
          };
        } else if (mod === 'geo') {
          const text = String(fd.get('text') || '').trim();
          const lat = parseFloat(fd.get('lat'));
          const lng = parseFloat(fd.get('lng'));
          if (!text) return setFormNotice('УКАЖИТЕ ОПИСАНИЕ МЕСТА', true);
          if (isNaN(lat) || lat < -90 || lat > 90) return setFormNotice('ШИРОТА ДОЛЖНА БЫТЬ ОТ -90 ДО 90', true);
          if (isNaN(lng) || lng < -180 || lng > 180) return setFormNotice('ДОЛГОТА ДОЛЖНА БЫТЬ ОТ -180 ДО 180', true);
          payload = { user_id: appState.userId, text, lat, lng };
        } else if (mod === 'countdowns') {
          const title = String(fd.get('title') || '').trim();
          const target_date = String(fd.get('target_date') || '').trim();
          if (!title) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ СОБЫТИЯ', true);
          if (!target_date) return setFormNotice('ВЫБЕРИТЕ ЦЕЛЕВУЮ ДАТУ', true);
          payload = { user_id: appState.userId, title, target_date };
        }

        if (!payload) return;

        setSubmitState(true);
        try {
          await apiRequest(`/${mod}`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          await fetchModule(mod);
          setConnectionStatus('online');
          setSubmitState(false);
          closeSheet();
          renderApp();
          TelegramBridge.haptic('medium');
          showToast('ЗАПИСЬ СОХРАНЕНА');
        } catch (err) {
          console.error('Save error:', err);
          setSubmitState(false);
          setConnectionStatus('error');
          setFormNotice('ОШИБКА СОХРАНЕНИЯ НА СЕРВЕР', true);
          showToast('ОШИБКА СЕТИ ПРИ СОХРАНЕНИИ', true);
        }
      }

      /* ---------------------------------------------------------
         7. ДЕЙСТВИЯ С ЭЛЕМЕНТАМИ (PUT / DELETE / OPEN)
         --------------------------------------------------------- */
      async function handleToggleTask(btn) {
        const id = btn.getAttribute('data-id');
        const currentStatus = btn.getAttribute('data-status');
        const nextStatus = currentStatus === 'done' ? 'todo' : 'done';

        btn.disabled = true;
        try {
          await apiRequest(`/tasks/${encodeURIComponent(id)}`, {
            method: 'PUT',
            body: JSON.stringify({ status: nextStatus })
          });
          await fetchModule('tasks');
          setConnectionStatus('online');
          TelegramBridge.haptic('light');
          renderApp();
        } catch (err) {
          console.error('Toggle task error:', err);
          btn.disabled = false;
          setConnectionStatus('error');
          showToast('НЕ УДАЛОСЬ ОБНОВИТЬ СТАТУС', true);
        }
      }

      async function handleDeleteItem(btn) {
        const modId = btn.getAttribute('data-module');
        const itemId = btn.getAttribute('data-id');
        if (!modId || !itemId) return;

        btn.disabled = true;
        try {
          await apiRequest(`/${modId}/${encodeURIComponent(itemId)}`, {
            method: 'DELETE'
          });
          await fetchModule(modId);
          setConnectionStatus('online');
          TelegramBridge.haptic('light');
          renderApp();
          showToast('ЗАПИСЬ УДАЛЕНА');
        } catch (err) {
          console.error('Delete error:', err);
          btn.disabled = false;
          setConnectionStatus('error');
          showToast('ОШИБКА СЕТИ ПРИ УДАЛЕНИИ', true);
        }
      }

      /* ---------------------------------------------------------
         8. ПРИВЯЗКА ОБРАБОТЧИКОВ СОБЫТИЙ
         --------------------------------------------------------- */
      function bindEvents() {
        // Кнопка принудительной синхронизации в шапке
        document.getElementById('refresh-btn').addEventListener('click', () => {
          TelegramBridge.haptic('light');
          syncAllModules(true);
        });

        // Переключение вкладок
        document.getElementById('tabs-nav').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-tab]');
          if (!btn) return;
          const nextMod = btn.getAttribute('data-tab');
          if (nextMod && nextMod !== appState.activeModule) {
            appState.activeModule = nextMod;
            TelegramBridge.haptic('light');
            renderApp();
          }
        });

        // Делегирование кликов внутри основного списка
        document.getElementById('main-area').addEventListener('click', (e) => {
          const filterBtn = e.target.closest('[data-task-filter]');
          if (filterBtn) {
            appState.taskFilter = filterBtn.getAttribute('data-task-filter') || 'all';
            renderApp();
            return;
          }

          const toggleBtn = e.target.closest('[data-action="toggle-task"]');
          if (toggleBtn) {
            handleToggleTask(toggleBtn);
            return;
          }

          const delBtn = e.target.closest('[data-action="delete"]');
          if (delBtn) {
            handleDeleteItem(delBtn);
            return;
          }

          const openBtn = e.target.closest('[data-action="open-link"]');
          if (openBtn) {
            const url = openBtn.getAttribute('data-url');
            if (url) {
              TelegramBridge.haptic('light');
              TelegramBridge.openExternal(url);
            }
          }
        });

        // Открытие и закрытие шторки
        document.getElementById('fab-btn').addEventListener('click', openSheet);
        document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
        document.getElementById('sheet-overlay').addEventListener('click', (e) => {
          if (e.target === e.currentTarget) closeSheet();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeSheet();
        });

        // Интерактив внутри формы (выбор настроения и геолокация)
        document.getElementById('sheet-fields').addEventListener('click', (e) => {
          const moodBtn = e.target.closest('[data-mood]');
          if (moodBtn) {
            appState.selectedMood = moodBtn.getAttribute('data-mood');
            document.querySelectorAll('#mood-grid .mood-btn').forEach((btn) => {
              btn.classList.toggle('is-selected', btn === moodBtn);
            });
            return;
          }

          const locateBtn = e.target.closest('#geo-locate-btn');
          if (locateBtn) {
            if (!navigator.geolocation) {
              setFormNotice('ГЕОЛОКАЦИЯ НЕ ПОДДЕРЖИВАЕТСЯ УСТРОЙСТВОМ', true);
              return;
            }
            locateBtn.disabled = true;
            setFormNotice('ЗАПРОС КООРДИНАТ...', false);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const latInput = document.getElementById('inp-geo-lat');
                const lngInput = document.getElementById('inp-geo-lng');
                if (latInput) latInput.value = pos.coords.latitude.toFixed(6);
                if (lngInput) lngInput.value = pos.coords.longitude.toFixed(6);
                locateBtn.disabled = false;
                setFormNotice('КООРДИНАТЫ ОПРЕДЕЛЕНЫ', false);
                TelegramBridge.haptic('light');
              },
              () => {
                locateBtn.disabled = false;
                setFormNotice('ДОСТУП К ГЕОПОЗИЦИИ ОТКЛОНЁН — ВВЕДИТЕ ВРУЧНУЮ', true);
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          }
        });

        // Отправка формы
        document.getElementById('sheet-form').addEventListener('submit', handleSheetSubmit);
      }

      /* ---------------------------------------------------------
         9. ЗАПУСК ПРИЛОЖЕНИЯ
         --------------------------------------------------------- */
      function initApp() {
        TelegramBridge.init();
        appState.userId = TelegramBridge.getUserId();

        const userBadge = document.getElementById('user-badge');
        if (userBadge) {
          userBadge.textContent = `UID // ${appState.userId}`;
        }

        updateLiveClock();
        setInterval(updateLiveClock, 1000);

        bindEvents();
        renderApp();
        syncAllModules(false);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
