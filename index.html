<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistant V10 Dark Neon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #090d16; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        /* Стеклянные панели */
        .glass-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .glass-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
            outline: none;
        }
        /* Чтобы иконка календаря в темной теме была белой */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.7;
        }
        .done-task { text-decoration: line-through; color: #64748b; }
        .hidden-tab { display: none !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-animate { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative selection:bg-violet-500 selection:text-white">

    <!-- Фоновое неоновое свечение -->
    <div class="fixed -top-24 -left-24 w-72 h-72 bg-violet-600/25 rounded-full blur-[90px] pointer-events-none z-0"></div>
    <div class="fixed top-1/2 -right-24 w-72 h-72 bg-cyan-500/15 rounded-full blur-[90px] pointer-events-none z-0"></div>

    <!-- Стеклянная шапка -->
    <header class="px-5 py-4 glass-card border-t-0 border-x-0 flex items-center justify-between sticky top-0 flex-shrink-0 z-50">
        <div>
            <h1 id="user-greeting" class="text-xl font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">Привет! 👋</h1>
            <div class="flex items-center gap-2 mt-1">
                <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse"></span>
                <p class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest">Neon OS 10.0</p>
            </div>
        </div>
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-600 to-cyan-500 p-[1px] shadow-lg shadow-violet-500/25">
            <div class="w-full h-full bg-slate-950/80 rounded-2xl flex items-center justify-center text-xl">⚡</div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-1 overflow-y-auto p-4 pb-32 z-10 space-y-5">
        
        <!-- 1: ЗАМЕТКИ -->
        <div id="view-notes" class="space-y-4 tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold text-violet-400 uppercase tracking-wider">⚡ Быстрая мысль</span>
                </div>
                <textarea id="note-input" placeholder="Запиши идею, пока не забыл..." class="w-full p-3.5 rounded-2xl glass-input h-28 resize-none text-sm placeholder:text-slate-500 transition-all"></textarea>
                <button onclick="addNote()" id="btn-add-note" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold text-sm shadow-lg shadow-violet-600/30 active:scale-[0.98] transition-all">Сохранить в память</button>
            </div>
            <div id="list-notes" class="space-y-3"></div>
        </div>

        <!-- 2: ЗАДАЧИ -->
        <div id="view-tasks" class="space-y-4 hidden-tab tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">🎯 Новая цель</span>
                <input type="text" id="task-input" placeholder="Что нужно сделать?" class="w-full p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500 transition-all">
                <div class="flex gap-2.5">
                    <input type="datetime-local" id="task-deadline" class="flex-1 p-3 rounded-2xl glass-input text-xs text-slate-300">
                    <button onclick="addTask()" id="btn-add-task" class="px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/25 active:scale-95 transition-all">+</button>
                </div>
            </div>
            <div id="list-tasks" class="space-y-3"></div>
        </div>

        <!-- 3: ГЕО -->
        <div id="view-geo" class="space-y-4 hidden-tab tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider">📍 Радар локаций</span>
                <input type="text" id="geo-input" placeholder="Название точки (ПВЗ, кафе, склад)..." class="w-full p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500 transition-all">
                <button onclick="addGeo()" id="btn-add-geo" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-cyan-500/30 active:scale-[0.98] transition-all">Зафиксировать координаты</button>
            </div>
            <div id="list-geo" class="space-y-3"></div>
        </div>

        <!-- 4: ССЫЛКИ -->
        <div id="view-links" class="space-y-4 hidden-tab tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-pink-400 uppercase tracking-wider">🔗 Отложенный контент</span>
                <input type="text" id="link-title" placeholder="Название статьи, видео или товара..." class="w-full p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500 transition-all">
                <div class="flex gap-2.5">
                    <input type="url" id="link-url" placeholder="https://..." class="flex-1 p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500">
                    <button onclick="addLink()" id="btn-add-link" class="px-6 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black text-xl shadow-lg shadow-pink-500/25 active:scale-95 transition-all">+</button>
                </div>
            </div>
            <div id="list-links" class="space-y-3"></div>
        </div>

        <!-- 5: ПОДПИСКИ -->
        <div id="view-subs" class="space-y-4 hidden-tab tab-animate">
            <!-- Неоновый виджет расходов -->
            <div class="p-5 rounded-3xl bg-gradient-to-br from-violet-900/60 via-slate-900/80 to-fuchsia-900/40 border border-violet-500/30 shadow-lg shadow-violet-500/10 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-widest text-violet-300">Ежемесячный расход</p>
                    <p id="subs-total" class="text-3xl font-black text-white mt-1">0 BYN</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-violet-500/20 border border-violet-400/30 flex items-center justify-center text-2xl">💳</div>
            </div>

            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-violet-400 uppercase tracking-wider">Новый автоплатеж</span>
                <input type="text" id="sub-title" placeholder="Сервис (Яндекс Плюс, Музыка, Зал...)" class="w-full p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500">
                <div class="flex gap-2.5">
                    <input type="number" id="sub-amount" placeholder="Сумма" class="w-1/2 p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500">
                    <input type="number" id="sub-day" placeholder="День (1-31)" class="w-1/2 p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500">
                </div>
                <button onclick="addSub()" id="btn-add-sub" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-violet-600/30 active:scale-[0.98] transition-all">Добавить в трекер</button>
            </div>
            <div id="list-subs" class="space-y-3"></div>
        </div>

        <!-- 6: ДНЕВНИК -->
        <div id="view-diary" class="space-y-4 hidden-tab tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">📖 Бортовой журнал</span>
                <select id="diary-mood" class="w-full p-3.5 rounded-2xl glass-input text-base font-medium bg-slate-900 text-white">
                    <option value="🤩" class="bg-slate-900">🤩 Продуктивный / Топ день</option>
                    <option value="🙂" class="bg-slate-900">🙂 Спокойный хороший день</option>
                    <option value="😐" class="bg-slate-900">😐 Обычная рутина</option>
                    <option value="😔" class="bg-slate-900">😔 Устал / Выгорание</option>
                    <option value="😡" class="bg-slate-900">😡 Стресс и хаос</option>
                </select>
                <textarea id="diary-text" placeholder="Главное событие или вывод за сегодня..." class="w-full p-3.5 rounded-2xl glass-input h-24 resize-none text-sm placeholder:text-slate-500"></textarea>
                <button onclick="addDiary()" id="btn-add-diary" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-sm shadow-lg shadow-amber-500/25 active:scale-[0.98] transition-all">Зафиксировать день</button>
            </div>
            <div id="list-diary" class="space-y-3"></div>
        </div>

        <!-- 7: СЧЕТЧИКИ -->
        <div id="view-countdowns" class="space-y-4 hidden-tab tab-animate">
            <div class="glass-card p-4 rounded-3xl space-y-3">
                <span class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider">⏳ Таймер событий</span>
                <input type="text" id="cd-title" placeholder="Событие (Сессия, Отпуск, Новый год...)" class="w-full p-3.5 rounded-2xl glass-input text-sm placeholder:text-slate-500">
                <div class="flex gap-2.5">
                    <input type="date" id="cd-date" class="flex-1 p-3.5 rounded-2xl glass-input text-sm text-slate-300">
                    <button onclick="addCountdown()" id="btn-add-cd" class="px-6 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition-all">+</button>
                </div>
            </div>
            <div id="list-countdowns" class="space-y-3"></div>
        </div>

    </main>

    <!-- ПАРЯЩАЯ ДОК-КАПСУЛА (iOS Dark Glass) -->
    <div class="fixed bottom-4 left-0 right-0 px-3 z-50 pointer-events-none">
        <nav class="max-w-md mx-auto bg-slate-900/85 backdrop-blur-2xl border border-white/10 rounded-3xl p-1.5 shadow-[0_10px_40px_rgba(0,0,0,0.8)] pointer-events-auto">
            <div id="nav-container" class="flex overflow-x-auto hide-scroll gap-1">
                <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-white font-bold bg-gradient-to-tr from-violet-600 to-cyan-500 shadow-lg shadow-violet-500/30 flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">📝</span><span class="text-[9px] tracking-wide">Мысли</span>
                </button>
                <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">✅</span><span class="text-[9px] tracking-wide">Цели</span>
                </button>
                <button onclick="switchTab('geo')" id="nav-geo" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">📍</span><span class="text-[9px] tracking-wide">Точки</span>
                </button>
                <button onclick="switchTab('links')" id="nav-links" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">🔗</span><span class="text-[9px] tracking-wide">Ссылки</span>
                </button>
                <button onclick="switchTab('subs')" id="nav-subs" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">💳</span><span class="text-[9px] tracking-wide">Оплаты</span>
                </button>
                <button onclick="switchTab('diary')" id="nav-diary" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">📖</span><span class="text-[9px] tracking-wide">Дневник</span>
                </button>
                <button onclick="switchTab('countdowns')" id="nav-countdowns" class="flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium flex-shrink-0 transition-all">
                    <span class="text-lg mb-0.5">⏳</span><span class="text-[9px] tracking-wide">Таймер</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        var tg = window.Telegram.WebApp;
        tg.expand();
        var telegramId = 'test_user';
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramId = String(tg.initDataUnsafe.user.id);
            document.getElementById('user-greeting').innerText = 'Привет, ' + tg.initDataUnsafe.user.first_name + '!';
        }

        var API_URL = 'https://my-assistant-backend-0a8k.onrender.com';
        var TABS = ['notes', 'tasks', 'geo', 'links', 'subs', 'diary', 'countdowns'];

        window.switchTab = function(tabName) {
            for(var i = 0; i < TABS.length; i++) {
                var t = TABS[i];
                document.getElementById('view-' + t).className = 'space-y-4 hidden-tab tab-animate';
                document.getElementById('nav-' + t).className = 'flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-slate-400 font-medium hover:text-slate-200 flex-shrink-0 transition-all';
            }
            document.getElementById('view-' + tabName).className = 'space-y-4 tab-animate';
            document.getElementById('nav-' + tabName).className = 'flex flex-col items-center min-w-[64px] py-2 rounded-2xl text-white font-bold bg-gradient-to-tr from-violet-600 to-cyan-500 shadow-lg shadow-violet-500/30 flex-shrink-0 transition-all scale-105';
            
            document.getElementById('nav-' + tabName).scrollIntoView({ behavior: 'smooth', inline: 'center' });

            if (tabName === 'notes') loadNotes();
            if (tabName === 'tasks') loadTasks();
            if (tabName === 'geo') loadGeo();
            if (tabName === 'links') loadLinks();
            if (tabName === 'subs') loadSubs();
            if (tabName === 'diary') loadDiary();
            if (tabName === 'countdowns') loadCountdowns();
        };

        // 1. Заметки
        window.addNote = function() { var i = document.getElementById('note-input'); var b = document.getElementById('btn-add-note'); if(!i.value.trim()) return; b.innerText='Синхронизация...'; fetch(API_URL+'/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,text:i.value.trim()})}).then(function(){i.value='';b.innerText='Сохранить в память';loadNotes();}); };
        window.loadNotes = function() { var l = document.getElementById('list-notes'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Загрузка данных...</p>'; fetch(API_URL+'/notes?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">В памяти пока пусто</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--) h+='<div class="p-4 glass-card rounded-2xl flex justify-between gap-3 items-center border-l-2 border-l-violet-500"><span class="break-words w-full text-sm text-slate-200 leading-relaxed">'+d[i].text+'</span><button onclick="delNote('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0 active:scale-90">✕</button></div>'; l.innerHTML=h; }); };
        window.delNote = function(id) { fetch(API_URL+'/notes/'+id,{method:'DELETE'}).then(loadNotes); };

        // 2. Задачи
        window.addTask = function() { var i=document.getElementById('task-input'); var d=document.getElementById('task-deadline'); var b=document.getElementById('btn-add-task'); if(!i.value.trim()) return; b.innerText='...'; fetch(API_URL+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,title:i.value.trim(),deadline:d.value||null})}).then(function(){i.value='';d.value='';b.innerText='+';loadTasks();}); };
        window.loadTasks = function() { var l=document.getElementById('list-tasks'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Загрузка задач...</p>'; fetch(API_URL+'/tasks?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Все цели закрыты! ⚡</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--){ var dt=d[i].deadline?'<div class="inline-block text-[10px] bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-lg mt-2 font-semibold">⏰ '+new Date(d[i].deadline).toLocaleString('ru-RU')+'</div>':''; var isDone = d[i].status==='done'; h+='<div class="p-4 glass-card rounded-2xl '+(isDone?'opacity-50':'border-l-2 border-l-emerald-400')+' flex items-start gap-3.5"><input type="checkbox" class="mt-1 w-5 h-5 accent-emerald-400 rounded cursor-pointer" '+(isDone?'checked':'')+' onchange="togTask('+d[i].id+', this.checked)"><div class="w-full"><span class="text-sm font-medium text-slate-100 block '+(isDone?'done-task':'')+'">'+d[i].title+'</span>'+dt+'</div><button onclick="delTask('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0 active:scale-90">✕</button></div>'; } l.innerHTML=h; }); };
        window.togTask = function(id, st) { fetch(API_URL+'/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st?'done':'todo'})}).then(loadTasks); };
        window.delTask = function(id) { fetch(API_URL+'/tasks/'+id,{method:'DELETE'}).then(loadTasks); };

        // 3. Гео
        window.addGeo = function() { var i=document.getElementById('geo-input'); var b=document.getElementById('btn-add-geo'); if(!i.value.trim()) return; b.innerText='Связь со спутником...'; navigator.geolocation.getCurrentPosition(function(pos){ fetch(API_URL+'/geo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,text:i.value.trim(),lat:pos.coords.latitude,lng:pos.coords.longitude})}).then(function(){i.value='';b.innerText='Зафиксировать координаты';loadGeo();}); }, function(){alert('Нет доступа к GPS');b.innerText='Зафиксировать координаты';}); };
        window.loadGeo = function() { var l=document.getElementById('list-geo'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Сканирование...</p>'; fetch(API_URL+'/geo?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Координат пока нет</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--) h+='<div class="p-4 glass-card rounded-2xl border-l-2 border-l-cyan-400 flex flex-col gap-3"><div class="flex justify-between items-start gap-2"><span class="font-bold text-sm text-slate-100 w-full">'+d[i].text+'</span><button onclick="delGeo('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0">✕</button></div><a href="https://maps.google.com/?q='+d[i].lat+','+d[i].lng+'" target="_blank" class="text-xs font-bold text-cyan-300 bg-cyan-500/10 border border-cyan-500/20 px-3.5 py-2 rounded-xl w-max flex items-center gap-1.5">🗺 Открыть радар</a></div>'; l.innerHTML=h; }); };
        window.delGeo = function(id) { fetch(API_URL+'/geo/'+id,{method:'DELETE'}).then(loadGeo); };

        // 4. Ссылки
        window.addLink = function() { var t=document.getElementById('link-title'); var u=document.getElementById('link-url'); var b=document.getElementById('btn-add-link'); if(!t.value.trim() || !u.value.trim()) return; b.innerText='...'; fetch(API_URL+'/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,title:t.value.trim(),url:u.value.trim()})}).then(function(){t.value='';u.value='';b.innerText='+';loadLinks();}); };
        window.loadLinks = function() { var l=document.getElementById('list-links'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Загрузка...</p>'; fetch(API_URL+'/links?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Ссылок пока нет</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--) h+='<div class="p-4 glass-card rounded-2xl border-l-2 border-l-pink-500 flex justify-between items-center gap-3"><div class="w-full overflow-hidden"><span class="font-bold text-sm text-slate-100 block truncate mb-1.5">'+d[i].title+'</span><a href="'+d[i].url+'" target="_blank" class="text-xs font-bold text-pink-300 bg-pink-500/10 border border-pink-500/20 px-3 py-1.5 rounded-xl inline-block truncate max-w-full">🔗 Перейти к источнику</a></div><button onclick="delLink('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0">✕</button></div>'; l.innerHTML=h; }); };
        window.delLink = function(id) { fetch(API_URL+'/links/'+id,{method:'DELETE'}).then(loadLinks); };

        // 5. Подписки
        window.addSub = function() { var t=document.getElementById('sub-title'); var a=document.getElementById('sub-amount'); var d=document.getElementById('sub-day'); var b=document.getElementById('btn-add-sub'); if(!t.value.trim() || !a.value.trim() || !d.value.trim()) return; b.innerText='Сохранение...'; fetch(API_URL+'/subs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,title:t.value.trim(),amount:parseFloat(a.value),pay_day:parseInt(d.value)})}).then(function(){t.value='';a.value='';d.value='';b.innerText='Добавить в трекер';loadSubs();}); };
        window.loadSubs = function() { var l=document.getElementById('list-subs'); var tot=document.getElementById('subs-total'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Подсчет баланса...</p>'; fetch(API_URL+'/subs?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ var sum=0; for(var j=0;j<d.length;j++){ sum += Number(d[j].amount)||0; } if(tot) tot.innerText = sum.toFixed(2) + ' BYN'; if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Подписок нет</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--) h+='<div class="p-4 glass-card rounded-2xl flex justify-between items-center gap-3"><div class="w-full"><span class="font-bold text-sm text-slate-100 block">'+d[i].title+'</span><div class="flex items-center gap-2 mt-1.5"><span class="text-xs font-black text-violet-300 bg-violet-500/20 border border-violet-500/30 px-2.5 py-0.5 rounded-lg">'+d[i].amount+' BYN</span><span class="text-xs text-slate-400">Списание: '+d[i].pay_day+' числа</span></div></div><button onclick="delSub('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0">✕</button></div>'; l.innerHTML=h; }); };
        window.delSub = function(id) { fetch(API_URL+'/subs/'+id,{method:'DELETE'}).then(loadSubs); };

        // 6. Дневник
        window.addDiary = function() { var m=document.getElementById('diary-mood'); var t=document.getElementById('diary-text'); var b=document.getElementById('btn-add-diary'); if(!t.value.trim()) return; b.innerText='Запись...'; fetch(API_URL+'/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,mood:m.value,text:t.value.trim(),date_str:new Date().toLocaleDateString('ru-RU')})}).then(function(){t.value='';b.innerText='Зафиксировать день';loadDiary();}); };
        window.loadDiary = function() { var l=document.getElementById('list-diary'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Загрузка архива...</p>'; fetch(API_URL+'/diary?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Бортовой журнал пуст</div>';return;} var h=''; for(var i=0;i<d.length;i++) h+='<div class="p-4 glass-card rounded-2xl space-y-2.5"><div class="flex justify-between items-center border-b border-white/5 pb-2"><span class="text-[10px] text-amber-400 font-bold uppercase tracking-widest">📅 '+d[i].date_str+'</span><button onclick="delDiary('+d[i].id+')" class="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-400 font-bold text-[10px] flex items-center justify-center">✕</button></div><div class="flex gap-3.5 items-start pt-1"><span class="text-3xl bg-white/5 border border-white/10 p-2 rounded-2xl">'+d[i].mood+'</span><span class="text-sm text-slate-200 leading-relaxed pt-1">'+d[i].text+'</span></div></div>'; l.innerHTML=h; }); };
        window.delDiary = function(id) { fetch(API_URL+'/diary/'+id,{method:'DELETE'}).then(loadDiary); };

        // 7. Счетчики дней
        window.addCountdown = function() { var t=document.getElementById('cd-title'); var d=document.getElementById('cd-date'); var b=document.getElementById('btn-add-cd'); if(!t.value.trim() || !d.value) return; b.innerText='...'; fetch(API_URL+'/countdowns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:telegramId,title:t.value.trim(),target_date:d.value})}).then(function(){t.value='';d.value='';b.innerText='+';loadCountdowns();}); };
        window.loadCountdowns = function() { var l=document.getElementById('list-countdowns'); l.innerHTML='<p class="text-center text-xs text-slate-500 py-6 animate-pulse">Расчет интервалов...</p>'; fetch(API_URL+'/countdowns?user_id='+telegramId).then(function(r){return r.json();}).then(function(d){ if(!d.length){l.innerHTML='<div class="glass-card rounded-3xl text-center py-8 text-slate-500 text-xs">Активных таймеров нет</div>';return;} var h=''; for(var i=d.length-1;i>=0;i--){ var diff=new Date(d[i].target_date)-new Date(); var days=Math.ceil(diff/(1000*60*60*24)); var badgeClass = days>0 ? 'bg-cyan-500/15 border-cyan-500/30 text-cyan-300' : 'bg-fuchsia-500/15 border-fuchsia-500/30 text-fuchsia-300'; var subLabel = days>0 ? 'осталось' : 'прошло'; h+='<div class="p-4 glass-card rounded-2xl flex justify-between items-center gap-3"><div class="flex items-center gap-3.5 overflow-hidden"><div class="px-3 py-2 rounded-2xl border text-center min-w-[64px] '+badgeClass+'"><span class="text-xl font-black block leading-none">'+Math.abs(days)+'</span><span class="text-[9px] uppercase tracking-wider font-bold block mt-1">'+subLabel+'</span></div><div class="truncate"><span class="font-bold text-sm text-slate-100 block truncate">'+d[i].title+'</span><span class="text-[11px] text-slate-400">Цель: '+d[i].target_date+'</span></div></div><button onclick="delCountdown('+d[i].id+')" class="w-8 h-8 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center flex-shrink-0">✕</button></div>'; } l.innerHTML=h; }); };
        window.delCountdown = function(id) { fetch(API_URL+'/countdowns/'+id,{method:'DELETE'}).then(loadCountdowns); };

        // Запуск
        loadNotes();
    </script>
</body>
</html>
