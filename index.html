<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>brain. // Второй мозг</title>

  <!-- Подключение Google Fonts с системными фолбэками -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Официальный SDK Telegram Mini Apps (используется безопасно через try/catch) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 100% автономные стили: Swiss Editorial / Technical Neo-Minimalism -->
  <style>
    :root {
      --bg: #F6F6F4;
      --desk: #E8E8E3;
      --surface: #FFFFFF;
      --ink: #0D0D0D;
      --muted: #73736E;
      --signal: #FF4422;
      --border: #DCDCD6;

      --font-display: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Строгий сброс и 0px углы для всех элементов интерфейса */
    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0px;
      box-shadow: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    @media (min-width: 520px) {
      body {
        background-color: var(--desk);
      }
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    /* Корневой контейнер: без transform и overflow:hidden, чтобы position:fixed работал безупречно */
    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 520px) {
      .app {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }

    /* =========================================================
       ВЕРХНЯЯ ЗАКРЕПЛЁННАЯ ШАПКА + НАВИГАЦИЯ ПО 7 МОДУЛЯМ
       ========================================================= */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--ink);
      background-color: var(--bg);
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
      text-align: right;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--signal);
      display: inline-block;
      flex-shrink: 0;
    }

    .clock-line {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .clock-value {
      color: var(--ink);
      font-weight: 600;
    }

    /* Горизонтальная индексная навигация */
    .tabs-nav {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      margin: 0;
      border: none;
      border-right: 1px solid var(--border);
      background-color: transparent;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .tab-btn:hover {
      background-color: var(--surface);
    }

    .tab-btn .tab-code {
      color: var(--muted);
    }

    .tab-btn.is-active {
      background-color: var(--ink);
      color: #FFFFFF;
      border-right-color: var(--ink);
    }

    .tab-btn.is-active .tab-code {
      color: rgba(255, 255, 255, 0.58);
    }

    .tab-btn.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background-color: var(--signal);
    }

    /* =========================================================
       ОСНОВНОЙ КОНТЕНТ И ЗАГОЛОВКИ РАЗДЕЛОВ
       ========================================================= */
    .main-area {
      flex: 1 0 auto;
      padding-bottom: 96px;
    }

    .section-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--ink);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--bg);
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .section-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .section-index {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.05em;
      color: rgba(13, 13, 13, 0.14);
      user-select: none;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Панель фильтров и счётчиков */
    .sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background-color: var(--surface);
      flex-wrap: wrap;
    }

    .sub-bar-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sub-bar-label strong {
      color: var(--ink);
    }

    .filter-group {
      display: inline-flex;
      border: 1px solid var(--border);
    }

    .filter-btn {
      border: none;
      border-right: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      padding: 5px 9px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-btn:last-child {
      border-right: none;
    }

    .filter-btn.is-active {
      background-color: var(--ink);
      color: #FFFFFF;
    }

    /* Списки и карточки модулей */
    .item-list {
      display: flex;
      flex-direction: column;
    }

    .item-card {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .empty-code {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .empty-text {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* Кнопка удаления (×) */
    .btn-delete {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 18px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .btn-delete:hover,
    .btn-delete:active {
      background-color: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    /* 01. ЗАДАЧИ */
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-row.is-done {
      background-color: var(--bg);
      opacity: 0.62;
    }

    .task-check {
      width: 22px;
      height: 22px;
      margin-top: 1px;
      flex-shrink: 0;
      border: 1px solid var(--ink);
      background-color: var(--surface);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .task-check.is-checked {
      background-color: var(--ink);
    }

    .task-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .task-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .task-row.is-done .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .mono-date {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mono-date.is-urgent {
      color: var(--signal);
      font-weight: 600;
    }

    .badge-urgent {
      display: inline-block;
      padding: 2px 6px;
      background-color: var(--signal);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* 02. ЗАМЕТКИ */
    .note-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .note-index-line {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .note-index-line strong {
      color: var(--ink);
    }

    .note-body {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 03. ПОДПИСКИ */
    .subs-summary {
      background-color: var(--ink);
      color: #FFFFFF;
      padding: 20px 16px;
      border-bottom: 1px solid var(--ink);
    }

    .subs-summary-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 6px;
    }

    .subs-total-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .subs-total-num {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subs-total-cur {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--signal);
    }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sub-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .sub-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .sub-day {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .sub-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .sub-price {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .sub-price span {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 3px;
    }

    /* 04. ССЫЛКИ */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .link-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .link-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .link-domain {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-square-open {
      width: 34px;
      height: 34px;
      background-color: var(--ink);
      color: #FFFFFF;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1;
      transition: background-color 120ms ease;
    }

    .btn-square-open:hover,
    .btn-square-open:active {
      background-color: var(--signal);
    }

    /* 05. ДНЕВНИК */
    .diary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .diary-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mood-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid var(--ink);
      background-color: var(--bg);
      color: var(--ink);
    }

    .mood-tag.is-strong {
      background-color: var(--ink);
      color: #FFFFFF;
    }

    /* 06. ГЕО */
    .geo-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .geo-code {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .geo-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .geo-coords {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin-top: 8px;
    }

    .geo-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background-color: var(--ink);
      color: #FFFFFF;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn-map:hover,
    .btn-map:active {
      background-color: var(--signal);
    }

    /* 07. СЧЁТЧИКИ */
    .cd-card {
      background-color: var(--surface);
      border-bottom: 1px solid var(--ink);
      padding: 16px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 14px;
    }

    .cd-left {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .cd-target {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .cd-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      margin: 0;
      word-break: break-word;
    }

    .cd-delete-link {
      align-self: flex-start;
      border: none;
      background: transparent;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }

    .cd-delete-link:hover {
      color: var(--signal);
    }

    .cd-right {
      flex-shrink: 0;
      min-width: 104px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      text-align: right;
    }

    .cd-number {
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .cd-number.is-soon {
      color: var(--signal);
    }

    .cd-unit {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    .cd-unit.is-soon {
      color: var(--signal);
    }

    /* Нижний технический футер */
    .app-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background-color: var(--bg);
    }

    .reset-btn {
      border: none;
      background: transparent;
      padding: 2px 0;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .reset-btn:hover,
    .reset-btn.is-confirm {
      color: var(--signal);
    }

    /* =========================================================
       КНОПКА ДОБАВЛЕНИЯ (+) — СТРОГО В ПРАВОМ НИЖНЕМ УГЛУ
       ========================================================= */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 54px;
      height: 54px;
      background-color: #FF4422;
      color: #FFFFFF;
      border: 1px solid #FF4422;
      border-radius: 0px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .fab:hover,
    .fab:active {
      background-color: var(--ink);
      border-color: var(--ink);
    }

    @media (min-width: 520px) {
      .fab {
        right: calc(50% - 220px);
      }
    }

    /* =========================================================
       АДАПТИВНАЯ ШТОРКА ДОБАВЛЕНИЯ (BOTTOM SHEET MODAL)
       ========================================================= */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background-color: rgba(13, 13, 13, 0.52);

  <script>
    (function () {

      /* ---------------------------------------------------------
         1. БЕЗОПАСНАЯ ОБЁРТКА ДЛЯ TELEGRAM WEBAPP SDK
         --------------------------------------------------------- */
      var TelegramBridge = {
        getApp: function () {
          try {
            if (window.Telegram && window.Telegram.WebApp) {
              return window.Telegram.WebApp;
            }
          } catch (e) {}
          return null;
        },
        init: function () {
          try {
            var tg = this.getApp();
            if (!tg) return;
            if (typeof tg.ready === 'function') tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#F6F6F4');
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#F6F6F4');
          } catch (e) {
            console.warn('Telegram WebApp init skipped:', e);
          }
        },
        haptic: function (style) {
          try {
            var tg = this.getApp();
            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
              tg.HapticFeedback.impactOccurred(style || 'light');
            }
          } catch (e) {}
        }
      };

      /* ---------------------------------------------------------
         2. БЕЗОПАСНОЕ ХРАНИЛИЩЕ (LOCALSTORAGE + ФОЛБЭК В ПАМЯТЬ)
         --------------------------------------------------------- */
      var SafeStorage = (function () {
        var memoryFallback = {};
        return {
          getItem: function (key) {
            try {
              return window.localStorage.getItem(key);
            } catch (e) {
              return Object.prototype.hasOwnProperty.call(memoryFallback, key)
                ? memoryFallback[key]
                : null;
            }
          },
          setItem: function (key, value) {
            try {
              window.localStorage.setItem(key, value);
            } catch (e) {
              memoryFallback[key] = String(value);
            }
          }
        };
      })();

      /* ---------------------------------------------------------
         3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДАТ И ДЕМО-ДАННЫХ
         --------------------------------------------------------- */
      function pad2(num) {
        return num < 10 ? '0' + num : String(num);
      }

      function relativeDateTimeISO(hoursOffset) {
        var d = new Date(Date.now() + hoursOffset * 3600 * 1000);
        return (
          d.getFullYear() + '-' +
          pad2(d.getMonth() + 1) + '-' +
          pad2(d.getDate()) + 'T' +
          pad2(d.getHours()) + ':' +
          pad2(d.getMinutes())
        );
      }

      function relativeDateISO(daysOffset) {
        var d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + daysOffset);
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      function createDemoData() {

            { id: 'l_2', title: 'Панель управления Render', url: 'https://dashboard.render.com' },
            { id: 'l_3', title: 'Консоль базы данных Supabase', url: 'https://supabase.com/dashboard' },
            { id: 'l_4', title: 'Архив швейцарской типографики', url: 'https://www.swissted.com' }

            },

            }
          ],

            },

            },

            }
          ],
          countdowns: [
            { id: 'c_1', title: 'Релиз brain. v2.0 на Cloudflare', targetDate: relativeDateISO(5) },
            { id: 'c_2', title: 'Защита проектного этапа', targetDate: relativeDateISO(14) },
            { id: 'c_3', title: 'Начало зимних каникул', targetDate: relativeDateISO(38) }
          ]

      }

      /* ---------------------------------------------------------
         4. СЛОЙ ДАННЫХ (DATASERVICE) — ГОТОВ К ПОДКЛЮЧЕНИЮ FASTAPI
         Замените методы ниже на fetch() к Render, не меняя UI-код.
         --------------------------------------------------------- */
      var STORAGE_KEY = 'brain_miniapp_data_v2';

      var DataService = {
        // Базовый адрес вашего бэкенда на Render (для будущей интеграции)
        API_BASE_URL: 'https://my-assistant-backend-0a8k.onrender.com',

        /**
         * Загрузка всех 7 модулей (сейчас из SafeStorage, далее — GET к FastAPI)
         */
        loadAll: function () {
          var raw = SafeStorage.getItem(STORAGE_KEY);
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              if (parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.countdowns)) {
                return parsed;
              }
            } catch (e) {
              console.warn('Ошибка чтения кэша, загружаем демо-данные:', e);
            }
          }
          var demo = createDemoData();
          this._saveAll(demo);
          return demo;
        },

        /**
         * Добавление новой записи в выбранный модуль (далее — POST /{moduleId})
         */
        addItem: function (state, moduleId, payload) {
          var item = Object.assign({ id: moduleId + '_' + Date.now() }, payload);
          state[moduleId].unshift(item);
          this._saveAll(state);
          return item;
        },

        /**
         * Переключение статуса задачи todo / done (далее — PATCH /tasks/{id})
         */
        toggleTask: function (state, taskId) {
          for (var i = 0; i < state.tasks.length; i++) {
            if (state.tasks[i].id === taskId) {
              state.tasks[i].done = !state.tasks[i].done;
              this._saveAll(state);
              return state.tasks[i];
            }
          }
          return null;
        },

        /**
         * Удаление записи из любого модуля (далее — DELETE /{moduleId}/{id})
         */
        deleteItem: function (state, moduleId, itemId) {
          state[moduleId] = state[moduleId].filter(function (el) {
            return el.id !== itemId;
          });
          this._saveAll(state);
          return true;
        },

        /**
         * Восстановление демонстрационного набора
         */
        resetDemo: function () {
          var demo = createDemoData();
          this._saveAll(demo);
          return demo;
        },

        _saveAll: function (state) {
          try {
            SafeStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
        }
      };

      /* ---------------------------------------------------------
         5. МЕТАДАННЫЕ МОДУЛЕЙ И СОСТОЯНИЕ ПРИЛОЖЕНИЯ
         --------------------------------------------------------- */
      var MODULES = [
        { id: 'tasks',      code: '01', nav: 'ЗАДАЧИ',   title: 'задачи.',   eyebrow: 'ДЕДЛАЙНЫ И ПРИОРИТЕТЫ' },
        { id: 'notes',      code: '02', nav: 'ЗАМЕТКИ',  title: 'заметки.',  eyebrow: 'БУФЕР МЫСЛЕЙ И ТЕЗИСОВ' },
        { id: 'subs',       code: '03', nav: 'ПОДПИСКИ', title: 'подписки.', eyebrow: 'ЕЖЕМЕСЯЧНЫЕ СПИСАНИЯ' },

        { id: 'diary',      code: '05', nav: 'ДНЕВНИК',  title: 'дневник.',  eyebrow: 'БОРТОВОЙ ЖУРНАЛ' },
        { id: 'geo',        code: '06', nav: 'ГЕО',      title: 'гео.',      eyebrow: 'СОХРАНЁННЫЕ ТОЧКИ' },
        { id: 'countdowns', code: '07', nav: 'СЧЁТЧИКИ', title: 'счётчики.', eyebrow: 'ОБРАТНЫЙ ОТСЧЁТ' }
      ];

      var MOOD_TAGS = ['[ФОКУС]', '[СПОКОЙСТВИЕ]', '[ЭНЕРГИЯ]', '[УСТАЛОСТЬ]'];

      var appState = {
        data: null,
        activeModule: 'tasks',
        taskFilter: 'all', // all | active | done
        selectedMood: MOOD_TAGS[0],

      /* ---------------------------------------------------------
         6. УТИЛИТЫ ФОРМАТИРОВАНИЯ И ЭКРАНИРОВАНИЯ
         --------------------------------------------------------- */
      function escapeHtml(val) {
        return String(val === null || val === undefined ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateTime(isoStr) {
        if (!isoStr) return 'БЕЗ СРОКА';
        var d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return (
          pad2(d.getDate()) + '.' +
          pad2(d.getMonth() + 1) + '.' +
          d.getFullYear() + ' // ' +
          pad2(d.getHours()) + ':' +
          pad2(d.getMinutes())
        );
      }

      function formatDateOnly(dateStr) {
        if (!dateStr) return '—';
        var parts = String(dateStr).split('-');
        if (parts.length === 3) {
          return parts[2] + '.' + parts[1] + '.' + parts[0];
        }
        return dateStr;
      }

      function isUrgentTask(task) {
        if (task.done || !task.deadline) return false;
        var targetMs = new Date(task.deadline).getTime();
        if (isNaN(targetMs)) return false;
        return (targetMs - Date.now()) <= 24 * 3600 * 1000;
      }

      function normalizeUrl(raw) {
        var trimmed = String(raw || '').trim();
        if (!trimmed) return '';
        return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
      }

      function extractDomain(raw) {
        try {
          var u = new URL(normalizeUrl(raw));
          return u.hostname.replace(/^www\./i, '');
        } catch (e) {
          return String(raw || '').replace(/^https?:\/\//i, '').split('/')[0];
        }
      }

      function formatCoords(lat, lng) {
        var nLat = Number(lat);
        var nLng = Number(lng);
        if (isNaN(nLat) || isNaN(nLng)) return '—';
        var latDir = nLat >= 0 ? 'N' : 'S';
        var lngDir = nLng >= 0 ? 'E' : 'W';
        return Math.abs(nLat).toFixed(4) + '° ' + latDir + ' / ' + Math.abs(nLng).toFixed(4) + '° ' + lngDir;
      }

      function calcDaysRemaining(targetDateStr) {
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var parts = String(targetDateStr || '').split('-');
        if (parts.length !== 3) return 0;
        var target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        target.setHours(0, 0, 0, 0);
        return Math.round((target.getTime() - today.getTime()) / (24 * 3600 * 1000));
      }

      function pluralizeSubs(n) {
        var mod100 = Math.abs(n) % 100;
        var mod10 = mod100 % 10;
        if (mod100 > 10 && mod100 < 20) return 'ПОДПИСОК';
        if (mod10 === 1) return 'ПОДПИСКА';
        if (mod10 >= 2 && mod10 <= 4) return 'ПОДПИСКИ';
        return 'ПОДПИСОК';
      }

      function showToast(message) {
        var el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.classList.add('is-visible');
        if (appState.toastTimer) clearTimeout(appState.toastTimer);
        appState.toastTimer = setTimeout(function () {
          el.classList.remove('is-visible');
        }, 1900);
      }

      function showRuntimeError(msg) {
        var banner = document.getElementById('error-banner');
        if (!banner) return;
        banner.textContent = 'SYS ERROR // ' + msg;
        banner.classList.add('is-visible');
      }

      /* ---------------------------------------------------------
         7. ЖИВЫЕ ЧАСЫ В ШАПКЕ (ИНИЦИАЛИЗАЦИЯ СРАЗУ + 1 СЕК)
         --------------------------------------------------------- */
      function updateLiveClock() {
        var clockEl = document.getElementById('live-clock');
        if (!clockEl) return;
        var now = new Date();
        clockEl.textContent =
          pad2(now.getHours()) + ':' +
          pad2(now.getMinutes()) + ':' +
          pad2(now.getSeconds());
      }

      /* ---------------------------------------------------------
         8. РЕНДЕР НАВИГАЦИИ И МОДУЛЕЙ
         --------------------------------------------------------- */
      function renderTabs() {
        var nav = document.getElementById('tabs-nav');
        if (!nav) return;

        nav.innerHTML = MODULES.map(function (mod) {
          var activeClass = mod.id === appState.activeModule ? ' is-active' : '';
          return (
            '<button type="button" class="tab-btn' + activeClass + '" data-tab="' + mod.id + '">' +
              '<span class="tab-code">' + mod.code + '</span>' +
              '<span>' + mod.nav + '</span>' +
            '</button>'
          );
        }).join('');

        var activeBtn = nav.querySelector('.tab-btn.is-active');
        if (activeBtn && typeof activeBtn.scrollIntoView === 'function') {
          try {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          } catch (e) {}
        }

      function renderSectionHead(mod, countLabel) {
        return (
          '<section class="section-head">' +
            '<div>' +
              '<div class="section-eyebrow">' + mod.eyebrow + '</div>' +
              '<h2 class="section-title">' + mod.title + '</h2>' +
            '</div>' +
            '<div class="section-meta">' +
              '<div class="section-index">' + mod.code + '</div>' +
              '<div class="section-count">' + countLabel + '</div>' +
            '</div>' +
          '</section>'
        );
      }

      function renderEmpty(text) {
        return (
          '<div class="empty-state">' +
            '<div class="empty-code">[ ПУСТО // 00 ]</div>' +
            '<p class="empty-text">' + escapeHtml(text) + '</p>' +
          '</div>'
        );
      }

      /* 01. ЗАДАЧИ */
      function renderTasks(mod) {
        var allTasks = appState.data.tasks;
        var activeCount = allTasks.filter(function (t) { return !t.done; }).length;
        var filtered = allTasks.filter(function (t) {
          if (appState.taskFilter === 'active') return !t.done;
          if (appState.taskFilter === 'done') return t.done;
          return true;
        });

        // Невыполненные сверху
        filtered = filtered.slice().sort(function (a, b) {
          return Number(a.done) - Number(b.done);
        });

        var subBar =
          '<div class="sub-bar">' +
            '<div class="sub-bar-label">АКТИВНЫХ: <strong>' + activeCount + '</strong> // ВСЕГО: <strong>' + allTasks.length + '</strong></div>' +
            '<div class="filter-group" role="group" aria-label="Фильтр задач">' +
              '<button type="button" class="filter-btn' + (appState.taskFilter === 'all' ? ' is-active' : '') + '" data-task-filter="all">ВСЕ</button>' +
              '<button type="button" class="filter-btn' + (appState.taskFilter === 'active' ? ' is-active' : '') + '" data-task-filter="active">В РАБОТЕ</button>' +
              '<button type="button" class="filter-btn' + (appState.taskFilter === 'done' ? ' is-active' : '') + '" data-task-filter="done">ГОТОВО</button>' +
            '</div>' +
          '</div>';

        var bodyHtml = filtered.length === 0
          ? renderEmpty('В этом фильтре задач нет. Нажмите «+», чтобы создать новую задачу.')
          : '<div class="item-list">' + filtered.map(function (task) {
              var urgent = isUrgentTask(task);
              var checkIcon = task.done
                ? '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="3 8.5 6.5 12 13 4.5"></polyline></svg>'
                : '';

              return (
                '<article class="item-card task-row' + (task.done ? ' is-done' : '') + '">' +
                  '<button type="button" class="task-check' + (task.done ? ' is-checked' : '') + '" data-action="toggle-task" data-id="' + escapeHtml(task.id) + '" aria-label="Переключить статус задачи">' +
                    checkIcon +
                  '</button>' +
                  '<div class="task-body">' +
                    '<p class="task-title">' + escapeHtml(task.title) + '</p>' +
                    '<div class="task-meta">' +
                      '<span class="mono-date' + (urgent ? ' is-urgent' : '') + '">' + formatDateTime(task.deadline) + '</span>' +
                      (urgent ? '<span class="badge-urgent">СРОЧНО</span>' : '') +
                    '</div>' +
                  '</div>' +
                  '<button type="button" class="btn-delete" data-action="delete" data-module="tasks" data-id="' + escapeHtml(task.id) + '" aria-label="Удалить задачу">×</button>' +
                '</article>'
              );
            }).join('') + '</div>';

        return renderSectionHead(mod, 'АКТИВНЫХ: ' + pad2(activeCount)) + subBar + bodyHtml;
      }

      /* 02. ЗАМЕТКИ */
      function renderNotes(mod) {
        var notes = appState.data.notes;
        var bodyHtml = notes.length === 0
          ? renderEmpty('Заметок пока нет. Нажмите «+», чтобы зафиксировать мысль.')

                '<article class="item-card">' +

      /* 03. ПОДПИСКИ */

          '<div class="subs-summary">' +
            '<div class="subs-summary-label">ИТОГО В МЕСЯЦ // ' + subs.length + ' ' + pluralizeSubs(subs.length) + '</div>' +

          ? renderEmpty('Подписок пока нет. Добавьте регулярный платёж через «+».')

      /* 05. ДНЕВНИК */

      /* 06. ГЕО */
      function renderGeo(mod) {
        var points = appState.data.geo;
        var bodyHtml = points.length === 0
          ? renderEmpty('Геоточек пока нет. Сохраните локацию через «+».')
          : '<div class="item-list">' + points.map(function (pt, idx) {
              var mapUrl = 'https://www.google.com/maps?q=' + encodeURIComponent(pt.lat) + ',' + encodeURIComponent(pt.lng);
              return (
                '<article class="item-card">' +
                  '<div class="geo-top">' +

                      '<div class="geo-code">LOC_' + pad2(idx + 1) + '</div>' +

                    '</div>' +
                    '<button type="button" class="btn-delete" data-action="delete" data-module="geo" data-id="' + escapeHtml(pt.id) + '" aria-label="Удалить точку">×</button>' +
                  '</div>' +

                    '<a class="btn-map" href="' + mapUrl + '" target="_blank" rel="noopener noreferrer">КАРТА ↗</a>' +
                  '</div>' +
                '</article>'
              );
            }).join('') + '</div>';

        return renderSectionHead(mod, 'ТОЧЕК: ' + pad2(points.length)) + bodyHtml;
      }

      /* 07. СЧЁТЧИКИ */
      function renderCountdowns(mod) {
        var items = appState.data.countdowns.slice().sort(function (a, b) {
          return calcDaysRemaining(a.targetDate) - calcDaysRemaining(b.targetDate);
        });

        var bodyHtml = items.length === 0
          ? renderEmpty('Счётчиков пока нет. Добавьте целевую дату через «+».')
          : '<div class="item-list">' + items.map(function (cd) {
              var days = calcDaysRemaining(cd.targetDate);
              var isSoon = days <= 7;
              var displayNum = days < 0 ? String(Math.abs(days)) : (days < 10 ? pad2(days) : String(days));
              var unitText = days === 0 ? 'СЕГОДНЯ' : (days < 0 ? 'ДН. НАЗАД' : 'ДН.');

              return (
                '<article class="cd-card">' +
                  '<div class="cd-left">' +
                    '<div>' +
                      '<div class="cd-target">ЦЕЛЬ // ' + formatDateOnly(cd.targetDate) + '</div>' +
                      '<h3 class="cd-title">' + escapeHtml(cd.title) + '</h3>' +
                    '</div>' +
                    '<button type="button" class="cd-delete-link" data-action="delete" data-module="countdowns" data-id="' + escapeHtml(cd.id) + '">[ УДАЛИТЬ × ]</button>' +
                  '</div>' +
                  '<div class="cd-right">' +
                    '<div class="cd-number' + (isSoon ? ' is-soon' : '') + '">' + displayNum + '</div>' +
                    '<div class="cd-unit' + (isSoon ? ' is-soon' : '') + '">' + unitText + '</div>' +
                  '</div>' +
                '</article>'
              );
            }).join('') + '</div>';

        return renderSectionHead(mod, 'СОБЫТИЙ: ' + pad2(items.length)) + bodyHtml;
      }

      function renderApp() {
        renderTabs();
        var mod = MODULES.find(function (m) { return m.id === appState.activeModule; }) || MODULES[0];
        var main = document.getElementById('main-area');
        if (!main) return;

        var html = '';
        if (mod.id === 'tasks') html = renderTasks(mod);
        else if (mod.id === 'notes') html = renderNotes(mod);
        else if (mod.id === 'subs') html = renderSubs(mod);
        else if (mod.id === 'links') html = renderLinks(mod);
        else if (mod.id === 'diary') html = renderDiary(mod);
        else if (mod.id === 'geo') html = renderGeo(mod);
        else if (mod.id === 'countdowns') html = renderCountdowns(mod);

        main.innerHTML = html;
      }

      /* ---------------------------------------------------------
         9. АДАПТИВНАЯ ШТОРКА ДОБАВЛЕНИЯ (BOTTOM SHEET)

      function setFormNotice(msg, isError) {

          return;

      function openSheet() {
        var mod = MODULES.find(function (m) { return m.id === appState.activeModule; }) || MODULES[0];
        document.getElementById('sheet-title').textContent = '+ ' + mod.code + ' ' + mod.nav;
        document.getElementById('sheet-fields').innerHTML = buildModalFields(mod.id);
        setFormNotice('', false);

        var overlay = document.getElementById('sheet-overlay');
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        TelegramBridge.haptic('light');

        setTimeout(function () {
          var first = document.querySelector('#sheet-fields input, #sheet-fields textarea');
          if (first) first.focus();
        }, 60);
      }

      function closeSheet() {
        var overlay = document.getElementById('sheet-overlay');
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        setFormNotice('', false);
      }

      function handleSheetSubmit(event) {
        event.preventDefault();
        setFormNotice('', false);

        var form = event.currentTarget;
        var fd = new FormData(form);
        var mod = appState.activeModule;

        if (mod === 'tasks') {
          var title = String(fd.get('title') || '').trim();
          var deadline = String(fd.get('deadline') || '').trim();
          if (!title) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ ЗАДАЧИ', true);
          if (!deadline) return setFormNotice('УКАЖИТЕ ДЕДЛАЙН', true);
          DataService.addItem(appState.data, 'tasks', { title: title, deadline: deadline, done: false });
        } else if (mod === 'notes') {
          var noteText = String(fd.get('text') || '').trim();
          if (!noteText) return setFormNotice('ВВЕДИТЕ ТЕКСТ ЗАМЕТКИ', true);
          DataService.addItem(appState.data, 'notes', { text: noteText, createdAt: relativeDateISO(0) });
        } else if (mod === 'subs') {
          var name = String(fd.get('name') || '').trim();
          var amount = parseFloat(fd.get('amount'));
          var billingDay = parseInt(fd.get('billingDay'), 10);
          if (!name) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ СЕРВИСА', true);
          if (isNaN(amount) || amount <= 0) return setFormNotice('УКАЖИТЕ КОРРЕКТНУЮ ЦЕНУ В BYN', true);
          if (isNaN(billingDay) || billingDay < 1 || billingDay > 31) return setFormNotice('ДЕНЬ СПИСАНИЯ: ОТ 1 ДО 31', true);
          DataService.addItem(appState.data, 'subs', { name: name, amount: amount, billingDay: billingDay });
        } else if (mod === 'links') {
          var linkTitle = String(fd.get('title') || '').trim();
          var linkUrl = normalizeUrl(fd.get('url'));
          if (!linkTitle) return setFormNotice('ВВЕДИТЕ ЗАГОЛОВОК ССЫЛКИ', true);
          if (!linkUrl || linkUrl === 'https://') return setFormNotice('ВВЕДИТЕ КОРРЕКТНЫЙ URL', true);
          DataService.addItem(appState.data, 'links', { title: linkTitle, url: linkUrl });
        } else if (mod === 'diary') {
          var diaryText = String(fd.get('text') || '').trim();
          if (!diaryText) return setFormNotice('ВВЕДИТЕ ТЕКСТ ЗАПИСИ', true);
          DataService.addItem(appState.data, 'diary', {
            date: relativeDateISO(0),
            mood: appState.selectedMood || MOOD_TAGS[0],
            text: diaryText
          });
        } else if (mod === 'geo') {
          var placeName = String(fd.get('name') || '').trim();
          var lat = parseFloat(fd.get('lat'));
          var lng = parseFloat(fd.get('lng'));
          if (!placeName) return setFormNotice('УКАЖИТЕ НАЗВАНИЕ МЕСТА', true);
          if (isNaN(lat) || lat < -90 || lat > 90) return setFormNotice('ШИРОТА ДОЛЖНА БЫТЬ ОТ -90 ДО 90', true);
          if (isNaN(lng) || lng < -180 || lng > 180) return setFormNotice('ДОЛГОТА ДОЛЖНА БЫТЬ ОТ -180 ДО 180', true);
          DataService.addItem(appState.data, 'geo', { name: placeName, lat: lat, lng: lng });
        } else if (mod === 'countdowns') {
          var cdTitle = String(fd.get('title') || '').trim();
          var targetDate = String(fd.get('targetDate') || '').trim();
          if (!cdTitle) return setFormNotice('ВВЕДИТЕ НАЗВАНИЕ СОБЫТИЯ', true);
          if (!targetDate) return setFormNotice('ВЫБЕРИТЕ ЦЕЛЕВУЮ ДАТУ', true);
          DataService.addItem(appState.data, 'countdowns', { title: cdTitle, targetDate: targetDate });
        }

        closeSheet();
        renderApp();
        TelegramBridge.haptic('medium');
        showToast('ЗАПИСЬ СОХРАНЕНА');
      }

      /* ---------------------------------------------------------
         10. ПРИВЯЗКА ОБРАБОТЧИКОВ СОБЫТИЙ
         --------------------------------------------------------- */
      function bindEvents() {
        // Переключение вкладок
        document.getElementById('tabs-nav').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-tab]');
          if (!btn) return;
          var nextMod = btn.getAttribute('data-tab');
          if (nextMod && nextMod !== appState.activeModule) {
            appState.activeModule = nextMod;
            TelegramBridge.haptic('light');
            renderApp();
          }
        });

        // Действия внутри основного контента
        document.getElementById('main-area').addEventListener('click', function (e) {
          var filterBtn = e.target.closest('[data-task-filter]');
          if (filterBtn) {
            appState.taskFilter = filterBtn.getAttribute('data-task-filter') || 'all';
            renderApp();
            return;
          }

          var toggleBtn = e.target.closest('[data-action="toggle-task"]');
          if (toggleBtn) {
            DataService.toggleTask(appState.data, toggleBtn.getAttribute('data-id'));
            TelegramBridge.haptic('light');
            renderApp();
            return;
          }

          var delBtn = e.target.closest('[data-action="delete"]');
          if (delBtn) {
            var modId = delBtn.getAttribute('data-module');
            var itemId = delBtn.getAttribute('data-id');
            DataService.deleteItem(appState.data, modId, itemId);
            TelegramBridge.haptic('light');
            renderApp();
            showToast('УДАЛЕНО');
          }
        });

        // Открытие и закрытие шторки
        document.getElementById('fab-btn').addEventListener('click', openSheet);
        document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
        document.getElementById('sheet-overlay').addEventListener('click', function (e) {
          if (e.target === e.currentTarget) closeSheet();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeSheet();
        });

        // Интерактивные кнопки внутри формы (настроение и геолокация)
        document.getElementById('sheet-fields').addEventListener('click', function (e) {
          var moodBtn = e.target.closest('[data-mood]');
          if (moodBtn) {
            appState.selectedMood = moodBtn.getAttribute('data-mood');
            var allMoodBtns = document.querySelectorAll('#mood-grid .mood-btn');
            for (var i = 0; i < allMoodBtns.length; i++) {
              allMoodBtns[i].classList.toggle('is-selected', allMoodBtns[i] === moodBtn);
            }
            return;
          }

          var locateBtn = e.target.closest('#geo-locate-btn');
          if (locateBtn) {
            if (!navigator.geolocation) {
              setFormNotice('ГЕОЛОКАЦИЯ НЕ ПОДДЕРЖИВАЕТСЯ', true);
              return;
            }
            setFormNotice('ЗАПРОС КООРДИНАТ...', false);
            navigator.geolocation.getCurrentPosition(
              function (pos) {
                var latInput = document.getElementById('inp-geo-lat');
                var lngInput = document.getElementById('inp-geo-lng');
                if (latInput) latInput.value = pos.coords.latitude.toFixed(6);
                if (lngInput) lngInput.value = pos.coords.longitude.toFixed(6);
                setFormNotice('КООРДИНАТЫ ОПРЕДЕЛЕНЫ', false);
                TelegramBridge.haptic('light');
              },
              function () {
                setFormNotice('ДОСТУП К ГЕОПОЗИЦИИ ОТКЛОНЁН — ВВЕДИТЕ ВРУЧНУЮ', true);
              },
              { enableHighAccuracy: true, timeout: 8000 }
            );
          }
        });

        // Отправка формы
        document.getElementById('sheet-form').addEventListener('submit', handleSheetSubmit);

        // Двойной клик для сброса демо-данных (без confirm)
        var resetBtn = document.getElementById('reset-demo-btn');
        resetBtn.addEventListener('click', function () {
          if (!appState.resetConfirm) {
            appState.resetConfirm = true;
            resetBtn.textContent = 'ПОДТВЕРДИТЬ?';
            resetBtn.classList.add('is-confirm');
            appState.resetTimer = setTimeout(function () {
              appState.resetConfirm = false;
              resetBtn.textContent = 'СБРОС ДЕМО';
              resetBtn.classList.remove('is-confirm');
            }, 3000);
          } else {
            clearTimeout(appState.resetTimer);
            appState.resetConfirm = false;
            resetBtn.textContent = 'СБРОС ДЕМО';
            resetBtn.classList.remove('is-confirm');
            appState.data = DataService.resetDemo();
            renderApp();
            showToast('ДЕМО-ДАННЫЕ ВОССТАНОВЛЕНЫ');
          }
        });
      }

      /* ---------------------------------------------------------
         11. БЕЗОПАСНЫЙ ЗАПУСК ПРИЛОЖЕНИЯ
         --------------------------------------------------------- */
      function initApp() {
        try {
          TelegramBridge.init();
          updateLiveClock();
          setInterval(updateLiveClock, 1000);

          appState.data = DataService.loadAll();
          bindEvents();
          renderApp();
        } catch (err) {
          console.error('Critical app init error:', err);
          showRuntimeError(err && err.message ? err.message : 'UNKNOWN INIT ERROR');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
