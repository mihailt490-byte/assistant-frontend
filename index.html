<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F6F4">
<title>мозг. — Второй мозг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — только структура: display, flex/grid, overflow, wrapping, ratio, geometry.
   Разместите этот `@layer` первым; CSS-код продукта, находящийся за пределами слоя, имеет приоритет над обычными правилами разметки.
   Скрытые и закрытые состояния диалоговых окон имеют приоритет над правилами отображения компонентов.
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* контейнеры */
  .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill { flex: 1 1 0; min-width: 0; }
  .od-fixed { flex: none; }
  .od-grid { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* Информация, расположенная друг над другом: каждый элемент находится на отдельной строке — никогда не размещается рядом с другими встроенными элементами span */
  .od-stat, .od-field, .od-cell { display: Grid; разрыв: var (--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* По умолчанию медиафайлы сохраняют свое исходное соотношение сторон; искаженные или обрезанные изображения никогда не отображаются.
     Обложка получена случайно. Параметр height:auto позволяет соотношению сторон преобладать над <img height="…">
     атрибут. Обрезка до однородной рамки является явно выраженной опцией: set --od-ratio
     И добавьте .od-media-cover вместе (согласно основному правилу, только там, где есть обрезка).
     преднамеренно — миниатюры плиток, декоративные заливки — никогда не используются для контента в полном кадре).
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* Функциональные встроенные SVG-иконки автоматически используют ограниченную геометрию; SVG-иконки с содержимым сохраняют свою собственную */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* Только текстовые данные — авторский текст переписывается в соответствии с бюджетом */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); } /* резервирование на уровне блока для общей базовой линии */
  .od-nowrap {пробел: nowrap; } /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep { word-break: keep-all; overflow-wrap: anywhere; } /* Метки CJK переносятся по пробелам / <wbr> в начале */

  /* Каркас экрана (опционально): полосы занимают собственное пространство, средняя часть прокручивается — отступы для хромакея не заданы */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* горизонтальная направляющая: следующий элемент выглядывает из-за края; оставшееся пространство сохраняется при переполнении */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --paper: #F6F6F4;
  --surface: #FFFFFF;
  --ink: #0D0D0D;
  --muted: #6B6B66;
  --line: #E2E2DE;
  --accent: #FF4422;
  --error: #B3270C;

  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --fs-micro: 10px;
  --fs-body: 15px;
  --fs-title: 36px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 28px;
  --sp-8: 32px;
  --sp-12: 48px;

  --dur-fast: 180ms;
  --dur-base: 240ms;
  --ease-out: cubic-bezier(.22,.85,.3,1);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  фон: #EAEAE6;
  цвет: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body.sheet-open { overflow: hidden; }

button, input, textarea { font: inherit; color: inherit; }
кнопка { курсор: указатель; }

:where(button, a, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app {
  position: relative;
  display: flex;
  flex-direction: column;
  ширина: 100%;
  max-width: 390px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--paper);
}

@media (min-width: 480px) {
  .app {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}

/* ---------- верхняя панель ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--paper);
}

.masthead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: calc(var(--sp-4) + env(safe-area-inset-top, 0px)) var(--sp-5) var(--sp-3);
}

.brand-name {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  межбуквенный интервал: -.045em;
}

.brand-sub {
  margin: var(--sp-2) 0 0;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .1em;
  color: var(--muted);
  text-transform: uppercase;
  white-space: nowrap;
}

.sys { flex: none; text-align: right; }

.sys-status {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .08em;
  цвет: var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
}

.sys-dot {
  ширина: 6 пикселей;
  высота: 6 пикселей;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
  анимация: пульсация 2,4 с, плавное нарастание-распада, бесконечность;
}

.sys-time {
  margin: var(--sp-1) 0 0;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .08em;
  color: var(--muted);
  white-space: nowrap;
}

/* ---------- модульная направляющая ---------- */

.navwrap { border-bottom: 1px Solid var(--line); }

.nav {
  display: flex;
  gap: var(--sp-2);
  padding: 0 var(--sp-5);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}

.nav::-webkit-scrollbar { display: none; }

.tab {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 44px;
  padding: 0 var(--sp-3);
  border: 1px solid transparent;
  border-radius: 0;
  фон: прозрачный;
  color: var(--muted);
  scroll-snap-align: start;
  transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, border-color var(--dur-fast) ease;
}

.tab-idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1;
  межбуквенный интервал: .04em;
  color: var(--muted);
}

.tab-name {
  font-size: var(--fs-micro);
  font-weight: 600;
  line-height: 1;
  межбуквенный интервал: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.tab[aria-selected="true"] {
  background: var(--ink);
  border-color: var(--ink);
  цвет: #FFFFFF;
}

.tab[aria-selected="true"] .tab-idx { color: var(--accent); }

.tab:focus-visible { outline-offset: -2px; }

/* ---------- содержание ---------- */

main { flex: 1 1 auto; min-width: 0; }

.view { padding: var(--sp-7) var(--sp-5) 120px; }

.eyebrow {
  margin: 0 0 var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .1em;
  color: var(--muted);
  text-transform: uppercase;
}

.section-title-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-4);
}

.section-title {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 600;
  line-height: .92;
  межбуквенный интервал: -.04em;
}

.section-count {
  flex: none;
  padding-bottom: 2px;
  font-family: var(--font-mono);
  font-size: 20px;
  line-height: 1;
  межбуквенный интервал: -.02em;
  color: var(--muted);
}

.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .08em;
  color: var(--muted);
  text-transform: uppercase;
}

.meta-live {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  цвет: var(--ink);
}

.meta-dot {
  ширина: 5 пикселей;
  высота: 5 пикселей;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
}

/* ---------- список задач ---------- */

.list {
  list-style: none;
  margin: var(--sp-4) 0 0;
  padding: 0;
  border-top: 1px сплошная var(--line);
}

.task {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 44px;
  column-gap: var(--sp-3);
  align-items: start;
  padding: var(--sp-4) 0;
  border-bottom: 1px сплошная var(--line);
}

.check {
  position: relative;
  ширина: 44px;
  высота: 44 пикселя;
  margin: -12px 0 -12px -12px;
  padding: 0;
  display: grid;
  place-items: center;
  фон: прозрачный;
  border: 0;
  border-radius: 0;
  цвет: #FFFFFF;
}

.check::before {
  content: "";
  position: absolute;
  ширина: 20 пикселей;
  высота: 20 пикселей;
  background: var(--surface);
  border: 1px solid var(--ink);
  border-radius: 0;
  transition: background-color var(--dur-fast) ease, border-color var(--dur-fast) ease;
}

.check svg { position: relative; z-index: 1; opacity: 0; transition: opacity var(--dur-fast) ease; }
.task.is-done .check::before { background: var(--ink); border-color: var(--ink); }
.task.is-done .check svg { opacity: 1; }

.task-main { min-width: 0; padding-top: 1px; }

.task-title {
  margin: 0;
  font-size: var(--fs-body);
  font-weight: 500;
  line-height: 1.45;
  межбуквенный интервал: -.005em;
  overflow-wrap: anywhere;
}

.task.is-done .task-title {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}

.task-date,
.task-badge {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1;
  межбуквенный интервал: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.task-date { color: var(--muted); }

.task-badge {
  display: inline-block;
  padding: var(--sp-1) var(--sp-2);
  background: var(--accent);
  цвет: var(--ink);
  font-weight: 500;
}

.icon-btn {
  display: grid;
  place-items: center;
  ширина: 44px;
  высота: 44 пикселя;
  margin: -10px -10px -10px 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  фон: прозрачный;
  color: var(--muted);
  transition: color var(--dur-fast) ease;
}

/* ---------- примечания ---------- */

.note {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) 44px;
  column-gap: var(--sp-2);
  align-items: start;
  padding: var(--sp-4) 0;
  border-bottom: 1px сплошная var(--line);
}

.note-index {
  padding-top: 3px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.5;
  межбуквенный интервал: .04em;
  color: var(--muted);
  white-space: nowrap;
}

.note-body {
  margin: 0;
  font-size: var(--fs-body);
  line-height: 1.6;
  межбуквенный интервал: -.005em;
  overflow-wrap: anywhere;
}

/* ---------- пустой / заполнитель ---------- */

.empty {
  margin-top: var(--sp-4);
  padding: var(--sp-6) var(--sp-5);
  граница: сплошная 1 пиксель var(--line);
  background: var(--surface);
}

.empty-code {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .1em;
  цвет: var(--ink);
  text-transform: uppercase;
}

.empty-text {
  margin: var(--sp-3) 0 0;
  max-width: 30ch;
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
}

.soon {
  margin-top: var(--sp-5);
  padding: var(--sp-6) var(--sp-5);
  граница: сплошная 1 пиксель var(--line);
  background: var(--surface);
}

.soon-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}

.soon-index {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .08em;
  color: var(--muted);
  text-transform: uppercase;
}

.soon-status {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .08em;
  цвет: var(--ink);
  text-transform: uppercase;
}

.soon-title {
  margin: var(--sp-5) 0 0;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.3;
  межбуквенный интервал: -.01em;
}

.soon-text {
  margin: var(--sp-2) 0 0;
  max-width: 34ch;
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
}

/* ---------- добавить кнопку ---------- */

.fab {
  position: fixed;
  z-index: 40;
  справа: max(var(--sp-5), calc((100vw - 390px) / 2 + var(--sp-5)));
  bottom: calc(var(--sp-5) + env(safe-area-inset-bottom, 0px));
  display: grid;
  place-items: center;
  ширина: 52px;
  высота: 52px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: var(--accent);
  цвет: #FFFFFF;
  transition: opacity var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-fast) ease;
}

body.sheet-open .fab { opacity: 0; pointer-events: none; }

.fab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- нижний лист ---------- */

.sheet {
  position: fixed;
  top: auto;
  right: 0;
  bottom: 0;
  слева: 0;
  ширина: 100%;
  max-width: 390px;
  max-height: 90vh;
  max-height: 90dvh;
  margin: 0 auto;
  padding: 0;
  border: 0;
  border-top: 1px solid var(--ink);
  border-radius: 0;
  background: var(--surface);
  цвет: var(--ink);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sheet::backdrop { background: rgba(13, 13, 13, .4); }

.sheet[open] { animation: sheet-in var(--dur-base) var(--ease-out); }
.sheet[open]::backdrop { animation: fade-in var(--dur-fast) ease-out; }

.sheet.is-closing { animation: sheet-out var(--dur-fast) ease-in forwards; }
.sheet.is-closing::backdrop { animation: fade-out var(--dur-fast) ease-in forwards; }

.sheet-inner {
  padding: var(--sp-5) var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom, 0px));
}

.sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
}

.sheet-eyebrow {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .1em;
  color: var(--muted);
  text-transform: uppercase;
}

.sheet-title {
  margin: var(--sp-2) 0 0;
  font-size: 28px;
  font-weight: 600;
  line-height: 1;
  межбуквенный интервал: -.03em;
}

.sheet-close { margin: -10px -10px 0 0; }

#sheet-form { margin-top: var(--sp-7); }

.field { margin-bottom: var(--sp-5); }

.field-label {
  display: block;
  margin-bottom: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.2;
  межбуквенный интервал: .1em;
  color: var(--muted);
  text-transform: uppercase;
}

.label-opt {
  межбуквенный интервал: .06em;
  color: var(--muted);
}

.input {
  display: block;
  ширина: 100%;
  min-height: 44px;
  padding: var(--sp-2) 0;
  border: 0;
  border-bottom: 1px Solid var(--ink);
  border-radius: 0;
  фон: прозрачный;
  font-size: 16px;
  line-height: 1.4;
  цвет: var(--ink);
}

.input::placeholder { color: var(--muted); opacity: 1; }

.input:focus {
  outline: none;
  border-bottom-color: var(--accent);
  box-shadow: 0 1px 0 var(--accent);
}

.input[type="date"] {
  font-family: var(--font-mono);
  font-size: 14px;
  межбуквенный интервал: .04em;
  Цветовая схема: светлая;
}

.textarea {
  display: block;
  ширина: 100%;
  min-height: 120px;
  padding: var(--sp-3);
  граница: сплошная 1 пиксель var(--line);
  border-radius: 0;
  background: var(--paper);
  font-size: 16px;
  line-height: 1.55;
  цвет: var(--ink);

          '<label class="field-label" for="f-title">Название задачи</label>' +
          '<input class="input" id="f-title" name="title" type="text" autocomplete="off" maxlength="80"' +
            ' Placeholder="Например, оплатить хостинг" data-required="true" aria-describedby="f-title-error">' +
          '<p class="field-error" id="f-title-error" скрыто>Введите название задачи</p>' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label" for="f-date">Дедлайн <span class="label-opt">// опционально</span></label>' +
          '<input class="input" id="f-date" name="date" type="date" min="' + todayISO() + '">' +
        '</div>';
      sheetSubmit.innerHTML = 'Сохранить <span class="btn-arrow" aria-hidden="true">→</span>';
    } else if (module.id === 'notes') {
      sheetFields.innerHTML =
        '<div class="field">' +
          '<label class="field-label" for="f-body">Текст заметки</label>' +
          '<textarea class="textarea" id="f-body" name="body" rows="4" maxlength="280"' +
            ' Placeholder="Что стоит заменить?" data-required="true" aria-describedby="f-body-error f-body-count"></textarea>' +
          '<div class="field-foot">' +
            '<p class="field-hint">Свободный формат</p>' +
            '<p class="field-hint" id="f-body-count">0 / 280</p>' +
          '</div>' +
          '<p class="field-error" id="f-body-error" скрыто>Написать текст заметки</p>' +
        '</div>';
      sheetSubmit.innerHTML = 'Сохранить <span class="btn-arrow" aria-hidden="true">→</span>';
    } else {
      sheetFields.innerHTML =
        '<div class="sheet-notice">' +
          '<p class="sheet-notice-code">' + module.num + ' // ' + module.name + '</p>' +
          '<p class="sheet-notice-title">' + module.title + '</p>' +
          '<p class="sheet-notice-text">' + Module.note + ' Форма добавления готовится вместе с разделом — сейчас работают задачи и заметки.</p>' +
        '</div>';
      sheetSubmit.innerHTML = 'Понятно';
    }
  }

  function openSheet() {
    var module = MODULES.find(function (item) { return item.id === state.active; });
    if (!module) return;

    lastFocused = document.activeElement;
    buildSheet(module);
    sheet.classList.remove('is-closing');

    if (typeof sheet.showModal === 'function') {
      sheet.showModal();
    } else {
      sheet.setAttribute('open', '');
    }

    document.body.classList.add('sheet-open');

    var focusTarget = sheet.querySelector('input, textarea') || sheetSubmit;
    window.requestAnimationFrame(function () {
      if (focusTarget) focusTarget.focus({ preventScroll: true });
    });
  }

  function finishClose() {
    sheet.classList.remove('is-closing');
    Если (sheet.open) sheet.close();
    document.body.classList.remove('sheet-open');
    if (lastFocused && document.contains(lastFocused)) {
      lastFocused.focus({ preventScroll: true });
    }
  }

  function closeSheet() {
    if (!sheet.open || sheet.classList.contains('is-closing')) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    если (reduce) {
      finishClose();
      return;
    }
    sheet.classList.add('is-closing');
    window.setTimeout(finishClose, 180);
  }

  function hideToast() {
    toast.classList.remove('is-visible');
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }
  }

  function showToast(message, action) {
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }

    toastMsg.textContent = message;

    если (действие) {
      toastAction.hidden = false;
      toastAction.textContent = action.label;
      toastActionHandler = action.run;
    } else {
      toastAction.hidden = true;
      toastAction.textContent = '';
      toastActionHandler = null;
    }

    toast.classList.add('is-visible');
    toastTimer = window.setTimeout(function () {
      hideToast();
    }, действие ? 5200 : 2600);
  }

  function updateClock() {
    var now = new Date();
    var clock = document.getElementById('clock');
    if (clock) clock.textContent = 'Системное время // ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  }

  nav.addEventListener('click', function (event) {
    var tab = event.target.closest('.tab');
    if (tab && tab.dataset.module) selectModule(tab.dataset.module);
  });

  nav.addEventListener('keydown', function (event) {
    var tabs = Array.prototype.slice.call(nav.querySelectorAll('.tab'));
    var current = tabs.indexOf(document.activeElement);
    если (текущий === -1) вернуть;

    var next = null;
    if (event.key === 'ArrowRight') next = (current + 1) % tabs.length;
    if (event.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = tabs.length - 1;
    if (next === null) return;

    event.preventDefault();
    tabs[next].focus();
    selectModule(tabs[next].dataset.module);
  });

  views.addEventListener('click', function (event) {
    var control = event.target.closest('[data-act]');
    если (!control) return;

    var row = control.closest('[data-id]');
    если (!row) return;

    var id = row.dataset.id;
    вар действие = control.dataset.act;
    var panel = row.closest('.view');

    if (action === 'toggle') {
      toggleTask(id);
    } else if (action === 'delete' && panel) {
      if (panel.id === 'view-tasks') deleteTask(id);
      if (panel.id === 'view-notes') deleteNote(id);
    }
  });

  fab.addEventListener('click', openSheet);

  sheetClose.addEventListener('click', closeSheet);

  sheet.addEventListener('cancel', function (event) {
    event.preventDefault();
    closeSheet();
  });

  sheet.addEventListener('click', function (event) {
    if (event.target !== sheet) return;
    var rect = sheet.getBoundingClientRect();
    var outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top;
    if (outside) closeSheet();
  });

  sheet.addEventListener('close', function () {
    document.body.classList.remove('sheet-open');
  });

  sheetFields.addEventListener('input', function (event) {
    var input = event.target;
    if (!(input instanceof HTMLElement)) return;

    if (input.matches('[data-required]')) setFieldError(input, false);

    if (input.id === 'f-body') {
      var counter = document.getElementById('f-body-count');
      if (counter) counter.textContent = input.value.length + ' / 280';
    }
  });

  sheetFields.addEventListener('focusout', function (event) {
    var input = event.target;
    if (!(input instanceof HTMLElement)) return;
    if (input.matches('[data-required]') && !input.value.trim()) setFieldError(input, true);
  });

  sheetForm.addEventListener('submit', function (event) {
    event.preventDefault();

    if (sheetMode === 'placeholder') {
      closeSheet();
      return;
    }

    if (state.active === 'tasks') {
      var titleInput = document.getElementById('f-title');
      var dateInput = document.getElementById('f-date');
      Если (!titleInput) вернуть;

      var title = titleInput.value.trim();
      если (!title) {
        setFieldError(titleInput, true);
        titleInput.focus();
        return;
      }

      state.tasks.unshift({
        id: makeId(),
        title: title,
        дата: dateInput && dateInput.value ? dateInput.value: ноль,
        готово: false
      });

      renderTasks();
      closeSheet();
      showToast('Задача добавлена');
      return;
    }

    if (state.active === 'notes') {
      var bodyInput = document.getElementById('f-body');
      Если (!bodyInput) вернуть;

      var body = bodyInput.value.trim();
      если (!body) {
        setFieldError(bodyInput, true);
        bodyInput.focus();
        return;
      }

      state.notes.unshift({ id: makeId(), text: body });
      renderNotes();
      closeSheet();
      showToast('Заметка добавлена');
    }
  });

  toastAction.addEventListener('click', function () {
    var run = toastActionHandler;
    toastActionHandler = null;
    hideToast();
    if (typeof run === 'function') run();
  });

  renderNav();
  renderViews();
  renderTasks();
  renderNotes();
  updateClock();
  window.setInterval(updateClock, 30000);
})();
</script>
</body>
</html>
